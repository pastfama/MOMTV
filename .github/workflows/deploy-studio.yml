name: Deploy MOM TV Studio to Azure Static Web Apps

on:
  push:
    branches: [main]
    paths:
      - 'packages/studio/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd packages/studio && npm ci

      - name: Build
        run: cd packages/studio && npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'packages/studio/dist'
          api_location: 'packages/studio/api'
          output_location: '.'
          skip_app_build: true
          skip_api_build: true