name: Deploy MOM TV to momtv.fameshire.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gate on types. This was missing, which is how a commit shipped 121
      # type errors (including a build-breaking `import Lottie from
      # 'lottie-react'` default import) without CI noticing.
      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm --filter @momtv/studio build

      # The site runs on the `momtv` App Service (momtv.fameshire.com) as
      # `node server.js` — the tiny static server in momtv-server.js that
      # serves ./dist. The deploy package therefore needs server.js at the
      # root plus the built viewer in dist/. (The old gagarin Static Web App
      # is deleted; this App Service replaced it.)
      - name: Stage deployment package
        run: |
          mkdir -p deploy/dist
          cp momtv-server.js deploy/server.js
          cp -r packages/studio/dist/* deploy/dist/

      - name: Deploy to Azure App Service (momtv.fameshire.com)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'momtv'
          publish-profile: ${{ secrets.MOMTV_PUBLISH_PROFILE }}
          package: deploy
