version: "3.8"

services:
  # --- Redis (Event Bus) ---
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- MOMTV Backend ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - tts-cache:/app/.cache/tts
      - frames-cache:/app/.cache/frames
    restart: unless-stopped

  # --- MOMTV Studio (Vite dev server / static) ---
  studio:
    build:
      context: .
      dockerfile: Dockerfile.studio
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis-data:
  tts-cache:
  frames-cache: