<script>
// ═══════════════════════════════════════════════════════════════
// MOM TV — Twitch Client + Stream + Schedule + Commentary
// ═══════════════════════════════════════════════════════════════

const GQL_CLIENT_ID = "kimne78kx3ncx6brgo4mv6wki5h1ko"; // Public Twitch client ID for GQL (unauthenticated)
const OAUTH_CLIENT_ID = localStorage.getItem("momtv_custom_client_id") || ""; // User's registered app for OAuth
// For authenticated API calls, use OAuth client ID; for unauthenticated GQL, use public ID
function getAuthClientId() { return OAUTH_CLIENT_ID || GQL_CLIENT_ID; }
const DEFAULT_CHANNEL = "KNIG04Ei";
const REDIRECT_URI = window.location.origin + window.location.pathname;
const SCOPES = "user:read:follows chat:read chat:edit";
const TOKEN_KEY = "momtv_twitch_token";
const WATCHED_KEY = "momtv_watched_vods";

let twitchToken = null;
let twitchUser = null;
let currentChannel = DEFAULT_CHANNEL;
let currentVodId = null;
let isLive = false;
let ircWs = null;
let watchedVods = new Set(JSON.parse(localStorage.getItem(WATCHED_KEY) || "[]"));

// ── Schedule ──
const SCHEDULE = { slots: [
  { hour:13, studio:"MOM TV", lang:"ru", prime:false, hint:"Afternoon stream news", cast:[{name:"Дмитрий Волков",latin:"Dmitri Volkov",role:"Lead Anchor",lead:true,color:"#3b82f6"},{name:"Ирина Морозова",latin:"Irina Morozova",role:"Analyst",lead:false,color:"#ef4444"}]},
  { hour:14, studio:"Стрим Кингз", lang:"ru", prime:false, hint:"Streamer profiles", cast:[{name:"Татьяна Смирнова",latin:"Tatyana Smirnova",role:"Anchor",lead:true,color:"#a855f7"},{name:"Анна Васильева",latin:"Anna Vasileva",role:"Analyst",lead:false,color:"#ec4899"}]},
  { hour:15, studio:"MOM TV ФПС", lang:"ru", prime:false, hint:"FPS tactical breakdowns", cast:[{name:"Олег Кузнецов",latin:"Oleg Kuznetsov",role:"Analyst",lead:true,color:"#dc2626"},{name:"Сергей Новиков",latin:"Sergey Novikov",role:"Commentator",lead:false,color:"#f97316"}]},
  { hour:16, studio:"MOM TV Gaming", lang:"ru", prime:false, hint:"Esports coverage", cast:[{name:"Артём Соколов",latin:"Artem Sokolov",role:"Esports Analyst",lead:true,color:"#f59e0b"},{name:"Максим Петров",latin:"Maxim Petrov",role:"Host",lead:false,color:"#06b6d4"}]},
  { hour:17, studio:"Новичок", lang:"ru", prime:false, hint:"Rising streamers", cast:[{name:"Марина Лебедева",latin:"Marina Lebedeva",role:"Scout",lead:true,color:"#22c55e"},{name:"Павел Фёдоров",latin:"Pavel Fedorov",role:"Critic",lead:false,color:"#78716c"}]},
  { hour:18, studio:"MOM TV", lang:"ru", prime:true, event:"★ Evening Prime", hint:"Breaking stories", cast:[{name:"Дмитрий Волков",latin:"Dmitri Volkov",role:"Lead Anchor",lead:true,color:"#3b82f6"},{name:"Ирина Морозова",latin:"Irina Morozova",role:"Co-Anchor",lead:false,color:"#ef4444"}]},
  { hour:19, studio:"Стрим Кингз", lang:"ru", prime:true, event:"★ Prime Profiles", hint:"Top Russian streamers", cast:[{name:"Татьяна Смирнова",latin:"Tatyana Smirnova",role:"Anchor",lead:true,color:"#a855f7"},{name:"Анна Васильева",latin:"Anna Vasileva",role:"Analyst",lead:false,color:"#ec4899"}]},
  { hour:20, studio:"MOM TV Gaming", lang:"ru", prime:true, event:"★ Tournament Night", hint:"Tournament reactions", cast:[{name:"Артём Соколов",latin:"Artem Sokolov",role:"Lead Analyst",lead:true,color:"#f59e0b"},{name:"Максим Петров",latin:"Maxim Petrov",role:"Host",lead:false,color:"#06b6d4"}]},
  { hour:21, studio:"MOM TV Драма", lang:"ru", prime:true, event:"★ Showdown", hint:"Streamer drama", cast:[{name:"Роман Волков",latin:"Roman Volkov",role:"Host",lead:true,color:"#ef4444"},{name:"Юлия Захарова",latin:"Yulia Zakharova",role:"Devil's Advocate",lead:false,color:"#f59e0b"}]},
  { hour:22, studio:"Глубокий Анализ", lang:"ru", prime:false, hint:"Investigative analysis", cast:[{name:"Елена Морозова",latin:"Elena Morozova",role:"Narrator",lead:true,color:"#6366f1"},{name:"Николай Орлов",latin:"Nikolay Orlov",role:"Data Analyst",lead:false,color:"#0ea5e9"}]},
  { hour:23, studio:"MOM TV Драма", lang:"ru", prime:false, event:"Late Night", hint:"Unfiltered drama", cast:[{name:"Роман Волков",latin:"Roman Volkov",role:"Host",lead:true,color:"#ef4444"},{name:"Юлия Захарова",latin:"Yulia Zakharova",role:"Co-Host",lead:false,color:"#f59e0b"}]}
]};

// ═══ TWITCH AUTH ═══

function twitchLogin() {
  // Need a registered client ID for OAuth
  let cid = OAUTH_CLIENT_ID;
  if (!cid) {
    cid = prompt(
      "Twitch OAuth requires a registered Client ID.\n\n" +
      "1. Go to https://dev.twitch.tv/console/apps\n" +
      "2. Create an application (name: MOM TV)\n" +
      "3. Set OAuth Redirect URL to: " + REDIRECT_URI + "\n" +
      "4. Copy the Client ID and paste it here:\n\n" +
      "(It will be saved in your browser for next time)"
    );
    if (!cid) return;
    localStorage.setItem("momtv_custom_client_id", cid.trim());
  }
  const state = Math.random().toString(36).slice(2);
  sessionStorage.setItem("twitch_oauth_state", state);
  const url = `https://id.twitch.tv/oauth2/authorize?client_id=${cid.trim()}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${encodeURIComponent(SCOPES)}&state=${state}`;
  window.location.href = url;
}

function twitchLogout() {
  twitchToken = null; twitchUser = null;
  localStorage.removeItem(TOKEN_KEY);
  updateAuthUI();
  disconnectIRC();
  document.getElementById("followed-section").classList.add("hidden");
}

function checkOAuthRedirect() {
  const hash = window.location.hash;
  if (!hash.includes("access_token")) return false;
  const params = new URLSearchParams(hash.substring(1));
  const token = params.get("access_token");
  const state = params.get("state");
  if (state !== sessionStorage.getItem("twitch_oauth_state")) return false;
  if (token) {
    twitchToken = token;
    localStorage.setItem(TOKEN_KEY, token);
    window.history.replaceState(null, "", window.location.pathname);
    return true;
  }
  return false;
}

async function validateToken() {
  if (!twitchToken) return false;
  // Try to get user info via Helix API (avoids CORS issue with /oauth2/validate)
  const cid = getAuthClientId();
  try {
    const res = await fetch("https://api.twitch.tv/helix/users", {
      headers: { "Authorization": `Bearer ${twitchToken}`, "Client-Id": cid }
    });
    if (!res.ok) { twitchLogout(); return false; }
    const data = await res.json();
    if (data.data && data.data.length > 0) {
      twitchUser = { id: data.data[0].id, login: data.data[0].login };
      return true;
    }
    twitchLogout();
    return false;
  } catch { twitchLogout(); return false; }
}

function updateAuthUI() {
  const section = document.getElementById("auth-section");
  if (twitchUser) {
    section.innerHTML = `<div class="user-info">
      <img class="user-avatar" src="https://static-cdn.jtvnw.net/jtv_user_pictures/${twitchUser.login}-profile_image-70x70.png" onerror="this.style.display='none'" alt="">
      <span class="user-name">${twitchUser.login}</span>
      <button class="logout-btn" onclick="twitchLogout()">✕</button>
    </div>`;
  } else {
    section.innerHTML = `<button class="login-btn" id="login-btn" onclick="twitchLogin()">🔑 Login with Twitch</button>`;
  }
}

// ═══ TWITCH API ═══

async function helixGet(endpoint) {
  const headers = { "Client-Id": getAuthClientId() };
  if (twitchToken) headers["Authorization"] = `Bearer ${twitchToken}`;
  const res = await fetch(`https://api.twitch.tv/helix/${endpoint}`, { headers });
  if (!res.ok) throw new Error(`Twitch API ${res.status}`);
  return (await res.json()).data;
}

async function gqlQuery(query, variables) {
  const headers = { "Client-Id": GQL_CLIENT_ID, "Content-Type": "application/json" };
  const res = await fetch("https://gql.twitch.tv/gql", {
    method: "POST", headers, body: JSON.stringify({ query, variables })
  });
  return (await res.json()).data;
}

async function fetchFollowedChannels() {
  if (!twitchUser) return [];
  try {
    const data = await helixGet(`channels/followed?user_id=${twitchUser.id}&first=100`);
    return data || [];
  } catch (e) { console.warn("Followed fetch failed:", e); return []; }
}

async function fetchLiveFollowed() {
  if (!twitchUser) return [];
  try {
    const data = await helixGet(`streams/followed?user_id=${twitchUser.id}&first=100`);
    return (data || []).filter(s => s.type === "live");
  } catch (e) { console.warn("Live followed fetch failed:", e); return []; }
}

async function fetchVods(channel) {
  try {
    const data = await gqlQuery(
      `query($login:String!){user(login:$login){videos(first:20,type:ARCHIVE,sort:TIME){edges{node{id title game{displayName} createdAt lengthSeconds}}}}}`,
      { login: channel }
    );
    const edges = data?.user?.videos?.edges || [];
    return edges.map(e => ({
      id: e.node.id, title: e.node.title, game: e.node.game?.displayName || "",
      createdAt: e.node.createdAt, length: e.node.lengthSeconds
    }));
  } catch (e) { console.warn("VOD fetch failed:", e); return []; }
}

async function fetchStreamStatus(channel) {
  try {
    const data = await gqlQuery(
      `query($login:String!){user(login:$login){stream{type viewersCount game{displayName} title}videos(first:5,type:ARCHIVE,sort:TIME){edges{node{id title game{displayName}}}}}}`,
      { login: channel }
    );
    return data?.user;
  } catch (e) { console.warn("Stream status failed:", e); return null; }
}

// ═══ IRC CHAT ═══

function connectIRC(channel) {
  disconnectIRC();
  if (!twitchToken) return;
  try {
    ircWs = new WebSocket("wss://irc-ws.chat.twitch.tv:443");
    ircWs.onopen = () => {
      ircWs.send(`PASS oauth:${twitchToken}`);
      ircWs.send(`NICK ${twitchUser?.login || "justinfan12345"}`);
      ircWs.send(`JOIN #${channel}`);
      console.log(`[IRC] Connected to #${channel}`);
    };
    ircWs.onmessage = (e) => {
      const lines = e.data.split("\r\n");
      for (const line of lines) {
        if (line.includes("PRIVMSG")) {
          const match = line.match(/:(\w+)!\w+@\w+\.tmi\.twitch\.tv PRIVMSG #\w+ :(.+)/);
          if (match) addIRCMessage(match[1], match[2]);
        }
        if (line.startsWith("PING")) ircWs.send("PONG :tmi.twitch.tv");
      }
    };
    ircWs.onclose = () => console.log("[IRC] Disconnected");
    ircWs.onerror = (e) => console.warn("[IRC] Error:", e);
  } catch (e) { console.warn("[IRC] Connection failed:", e); }
}

function disconnectIRC() {
  if (ircWs) { ircWs.close(); ircWs = null; }
}

function addIRCMessage(user, text) {
  const el = document.getElementById("chat-container");
  if (!el || !el.querySelector(".irc-chat")) return;
  const chat = el.querySelector(".irc-chat");
  const colors = ["#ff6b6b","#ffd93d","#6bcb77","#4d96ff","#ff6bff","#ff9f43","#a29bfe","#fd79a8"];
  const color = colors[user.charCodeAt(0) % colors.length];
  const msg = document.createElement("div");
  msg.className = "irc-msg";
  msg.innerHTML = `<span class="irc-user" style="color:${color}">${user}</span>: ${escapeHtml(text)}`;
  chat.appendChild(msg);
  while (chat.children.length > 200) chat.removeChild(chat.firstChild);
  chat.scrollTop = chat.scrollHeight;
}

function escapeHtml(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

function renderChatEmbed(channel) {
  const el = document.getElementById("chat-container");
  const parents = getParents();
  const pp = parents.map(p => `&parent=${p}`).join("");
  // Always use Twitch embed chat — it provides full features:
  // typing, emotes, channel points, rewards, moderation, emoji picker
  el.innerHTML = `<div class="chat-embed"><iframe src="https://www.twitch.tv/embed/${channel}/chat?parent=${parents[0]}${pp}" frameborder="0"></iframe></div>`;
}

// ═══ STREAM EMBED ═══

function getParents() {
  const h = window.location.hostname;
  if (h === "localhost" || h === "127.0.0.1") return ["localhost", "127.0.0.1"];
  return [h];
}

function embedStream(channel) {
  channel = channel || currentChannel;
  currentChannel = channel;
  const pp = getParents().map(p => `&parent=${p}`).join("");
  document.getElementById("stream-embed").src = `https://player.twitch.tv/?channel=${channel}${pp}&autoplay=true&muted=true`;
  document.getElementById("vod-badge").style.display = "none";
  document.getElementById("back-live-btn").style.display = "none";
  document.getElementById("live-badge").textContent = "● LIVE";
  document.getElementById("live-badge").style.background = "#dc2626";
  isLive = true; currentVodId = null;
  renderChatEmbed(channel);
  addFeedItem("system", "MOM TV", "#e8794b", `Switched to LIVE: ${channel}`, "character");
}

function embedVod(vodId, title, channel) {
  channel = channel || currentChannel;
  const pp = getParents().map(p => `&parent=${p}`).join("");
  if (currentVodId) markWatched(currentVodId);
  document.getElementById("stream-embed").src = `https://player.twitch.tv/?video=${vodId}${pp}&autoplay=true&muted=true`;
  document.getElementById("vod-badge").style.display = "inline";
  document.getElementById("back-live-btn").style.display = "block";
  document.getElementById("live-badge").textContent = "● VOD";
  document.getElementById("live-badge").style.background = "#9146ff";
  isLive = false; currentVodId = vodId;
  document.getElementById("stream-now").innerHTML = `<strong>VOD:</strong> ${title || vodId}`;
  renderChatEmbed(channel);
  addFeedItem("system", "VOD Watcher", "#9146ff", `Now analyzing: ${title || vodId}`, "watcher");
  renderVodQueue();
}

function switchToLive() {
  embedStream(currentChannel);
  loadVods(currentChannel);
}

function switchToChannel(channel) {
  currentChannel = channel;
  embedStream(channel);
  loadVods(channel);
}

// ═══ VOD TRACKING ═══

function markWatched(vodId) {
  watchedVods.add(vodId);
  localStorage.setItem(WATCHED_KEY, JSON.stringify([...watchedVods]));
}

function getUnwatchedVods(vods) { return vods.filter(v => !watchedVods.has(v.id)); }

let allVods = [];
async function loadVods(channel) {
  allVods = await fetchVods(channel);
  document.getElementById("vod-channel-label").textContent = `(${channel})`;
  renderVodQueue();
}

function renderVodQueue() {
  const el = document.getElementById("vod-queue");
  if (allVods.length === 0) { el.innerHTML = '<div style="font-size:10px;color:rgba(232,224,212,.3);padding:4px">No VODs found</div>'; return; }
  el.innerHTML = allVods.slice(0, 10).map(v => {
    const status = v.id === currentVodId ? "current" : watchedVods.has(v.id) ? "watched" : "pending";
    return `<div class="vod-item${v.id === currentVodId ? ' active' : ''}" onclick="embedVod('${v.id}','${escapeHtml(v.title).replace(/'/g,"\\'")}','${currentChannel}')">
      <div class="vod-dot ${status}"></div>
      <div style="flex:1;min-width:0">
        <div class="vod-title" title="${escapeHtml(v.title)}">${v.title.slice(0,40)}${v.title.length>40?"...":""}</div>
        <div class="vod-game">${v.game || "Unknown"}</div>
      </div>
    </div>`;
  }).join("");
}

// ═══ FOLLOWED CHANNELS ═══

async function loadFollowedChannels() {
  if (!twitchUser) return;
  const [live, followed] = await Promise.all([fetchLiveFollowed(), fetchFollowedChannels()]);
  const section = document.getElementById("followed-section");
  section.classList.remove("hidden");

  // Live followed
  const liveEl = document.getElementById("live-followed");
  if (live.length === 0) {
    liveEl.innerHTML = '<div style="font-size:10px;color:rgba(232,224,212,.3);padding:4px">No followed channels live</div>';
  } else {
    liveEl.innerHTML = live.map(s => {
      const active = s.user_login === currentChannel ? " active" : "";
      return `<div class="channel-item${active}" onclick="switchToChannel('${s.user_login}')">
        <div class="channel-live-dot online"></div>
        <div class="channel-info">
          <div class="channel-name">${s.user_name}</div>
          <div class="channel-game">${s.game_name || "Just Chatting"} — ${escapeHtml(s.title||"").slice(0,30)}</div>
        </div>
        <div class="channel-viewers">${(s.viewer_count||0).toLocaleString()}</div>
      </div>`;
    }).join("");
  }

  // All followed (offline)
  const offline = followed.filter(f => !live.some(l => l.user_login === f.broadcaster_login));
  const allEl = document.getElementById("all-followed");
  if (offline.length === 0) {
    allEl.innerHTML = '<div style="font-size:10px;color:rgba(232,224,212,.3);padding:4px">All followed are live!</div>';
  } else {
    allEl.innerHTML = offline.slice(0, 15).map(f => {
      return `<div class="channel-item" onclick="switchToChannel('${f.broadcaster_login}')">
        <div class="channel-live-dot offline"></div>
        <div class="channel-info">
          <div class="channel-name">${f.broadcaster_name}</div>
          <div class="channel-game">${f.game_name || "Offline"}</div>
        </div>
      </div>`;
    }).join("");
  }
}

// ═══ COMMENTARY ═══

let feedCount = 0;
function addFeedItem(source, name, color, text, cls) {
  const feed = document.getElementById("commentary-feed");
  const time = new Date().toLocaleTimeString("en-US", { hour12: false });
  const initials = name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  const item = document.createElement("div");
  item.className = "feed-item";
  item.innerHTML = `<div class="feed-avatar" style="background:${color}">${initials}</div><div class="feed-body"><div class="feed-name">${name} <span class="feed-role">${source}</span></div><div class="feed-text">${text}</div></div><div class="feed-time">${time}</div>`;
  feed.appendChild(item);
  feed.scrollTop = feed.scrollHeight;
  feedCount++;
  document.getElementById("feed-count").textContent = `${feedCount} events`;
  while (feed.children.length > 100) feed.removeChild(feed.firstChild);
  if (cls === "character") document.getElementById("ticker-text").textContent = `${name}: "${text.slice(0,80)}" • MOM TV`;
}

const TEMPLATES = {
  "Дмитрий Волков":{color:"#3b82f6",lines:["Это было невероятно! Стрим горит!","Давайте разберёмся!","Пошли дальше!","Зрители, космос!"]},
  "Ирина Морозова":{color:"#ef4444",lines:["По данным источников...","Серьёзная ситуация.","Интересный поворот.","Цифры показывают рост."]},
  "Watcher":{color:"#dc2626",lines:["Viewer spike detected.","Chat surging.","Game change detected.","Stream quality: 1080p60."]},
  "Analyzer":{color:"#3b82f6",lines:["Intense gameplay detected.","On-screen: leaderboard.","Mood: excited.","Production quality: professional."]},
  "VI":{color:"#a855f7",lines:["Transcript: '...and that's how you win.'","OCR: kill feed 5 eliminations.","Topics: esports, tournaments.","Key visual: victory celebration."]}
};

function simulateCommentary() {
  const keys = Object.keys(TEMPLATES);
  const k = keys[Math.floor(Math.random()*keys.length)];
  const t = TEMPLATES[k];
  const l = t.lines[Math.floor(Math.random()*t.lines.length)];
  const cls = k==="Watcher"?"watcher":k==="Analyzer"?"analyzer":k==="VI"?"vi":"character";
  addFeedItem(k, k, t.color, l, cls);
}

// ═══ SCHEDULE + ON AIR ═══

function renderSchedule() {
  const grid = document.getElementById("schedule-grid");
  const h = new Date().getHours();
  grid.innerHTML = SCHEDULE.slots.map(s => {
    const live = s.hour===h, past = s.hour<h;
    const cls = `sched-slot${live?" live":""}${s.prime?" prime":""}${past?" past":""}`;
    const cast = s.cast.map(c=>`<span class="sched-chip${c.lead?" lead":""}">${c.latin}</span>`).join("");
    return `<div class="${cls}"><div class="sched-time">${live?'<span class="live-dot"></span>':''}${s.hour}:00</div><div class="sched-body"><div><span class="sched-studio">${s.studio}</span><span class="lang-tag lang-${s.lang}">${s.lang.toUpperCase()}</span>${s.event?` <span style="color:#e8794b;font-size:9px">${s.event}</span>`:''}</div><div class="sched-cast">${cast}</div></div></div>`;
  }).join("");
}

function renderOnAir() {
  const h = new Date().getHours();
  const slot = SCHEDULE.slots.find(s=>s.hour===h);
  const el = document.getElementById("on-air");
  if (!slot) {
    el.innerHTML='<div style="color:rgba(232,224,212,.3);font-size:11px;padding:10px;text-align:center">Off air</div>';
    return;
  }
  document.getElementById("overlay-studio").textContent=slot.studio;
  document.getElementById("overlay-cast").textContent=slot.cast.map(c=>c.latin).join(" + ");
  el.innerHTML=`<div class="on-air-studio">${slot.studio}</div><div class="on-air-hint">${slot.hint}</div>${slot.cast.map(c=>`<div class="on-air-char"><div class="char-av" style="background:${c.color}">${c.latin.split(" ").map(w=>w[0]).join("")}</div><div class="char-info"><div class="char-name">${c.name}</div><div class="char-sub">${c.latin}</div><div class="char-role">${c.role}</div></div></div>`).join('')}`;
}

// ═══ STREAM STATUS LOOP ═══

async function checkStream() {
  const user = await fetchStreamStatus(currentChannel);
  if (!user) return;
  const live = user.stream?.type === "live";
  if (live && !isLive) {
    embedStream(currentChannel);
    document.getElementById("stream-now").innerHTML = `<strong>${currentChannel}</strong> — ${user.stream.game?.displayName||""} — ${(user.stream.viewersCount||0).toLocaleString()} viewers`;
  } else if (!live && isLive) {
    // Go to VODs
    await loadVods(currentChannel);
    if (allVods.length > 0) {
      const unwatched = getUnwatchedVods(allVods);
      const next = unwatched[0] || allVods[0];
      if (next) embedVod(next.id, next.title, currentChannel);
    }
  } else if (live) {
    document.getElementById("stream-now").innerHTML = `<strong>${currentChannel}</strong> — ${user.stream.game?.displayName||""} — ${(user.stream.viewersCount||0).toLocaleString()} viewers`;
  }
}

function updateClock() { document.getElementById("clock").textContent = new Date().toLocaleTimeString("en-US",{hour12:false}); }

// ═══ SETTINGS PERSISTENCE ═══
const SETTINGS_KEY = "momtv_settings";
const DEFAULT_SETTINGS = { chatHeightVh: 50, sidebarWidth: 420, channel: DEFAULT_CHANNEL };
let settings = { ...DEFAULT_SETTINGS };

function loadSettings() {
  try {
    const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
    settings = { ...DEFAULT_SETTINGS, ...saved };
  } catch { settings = { ...DEFAULT_SETTINGS }; }
  applySettings();
}

function saveSettings() {
  settings.channel = currentChannel;
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
}

function applySettings() {
  const chatSection = document.getElementById("chat-section");
  if (chatSection) chatSection.style.height = `${settings.chatHeightVh}vh`;
  const main = document.querySelector(".main");
  if (main) main.style.gridTemplateColumns = `1fr ${settings.sidebarWidth}px`;
}

// ═══ DRAG HANDLE ═══
function initDragHandle() {
  const handle = document.getElementById("sidebar-drag");
  const chatSection = document.getElementById("chat-section");
  const sidebar = document.querySelector(".sidebar");
  if (!handle || !chatSection || !sidebar) return;

  let startY = 0, startHeight = 0, sidebarH = 0;

  handle.addEventListener("mousedown", (e) => {
    e.preventDefault();
    handle.classList.add("active");
    startY = e.clientY;
    startHeight = chatSection.offsetHeight;
    sidebarH = sidebar.offsetHeight;

    const onMove = (ev) => {
      const delta = startY - ev.clientY;
      const newChatH = Math.max(100, Math.min(sidebarH - 100, startHeight + delta));
      const vh = (newChatH / window.innerHeight) * 100;
      chatSection.style.height = `${vh}vh`;
      settings.chatHeightVh = Math.round(vh);
    };

    const onUp = () => {
      handle.classList.remove("active");
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      saveSettings();
    };

    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
}

// ═══ INIT ═══

(async function init() {
  // Check OAuth redirect
  checkOAuthRedirect();

  // Restore token
  if (!twitchToken) twitchToken = localStorage.getItem(TOKEN_KEY);

  // Validate
  if (twitchToken) {
    const valid = await validateToken();
    if (valid) {
      updateAuthUI();
      await loadFollowedChannels();
    }
  }

  // Load saved settings and init drag handle
  loadSettings();
  initDragHandle();

  // Embed default stream
  embedStream(settings.channel || DEFAULT_CHANNEL);
  await loadVods(DEFAULT_CHANNEL);
  renderSchedule();
  renderOnAir();
  updateClock();
  checkStream();

  // Start loops
  setInterval(updateClock, 1000);
  setInterval(renderSchedule, 60000);
  setInterval(renderOnAir, 60000);
  setInterval(checkStream, 60000);
  setInterval(simulateCommentary, 8000);
  setInterval(() => { if (twitchUser) loadFollowedChannels(); }, 120000);

  setTimeout(() => addFeedItem("system","MOM TV Director","#e8794b","Эфир начат! Русский Стрим Марафон.","character"), 2000);
  setTimeout(() => addFeedItem("Watcher","Watcher","#dc2626","All 3 analysis pipelines running.","watcher"), 4000);
})();
</script>
