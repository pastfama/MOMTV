<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOM TV — 24/7 AI Stream Network</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    /* ═══════════════════════════════════════════════════════
       MOM TV — Redesigned Visual Interface
       Modern glassmorphism · rich palette · premium feel
       ═══════════════════════════════════════════════════════ */

    :root {
      --bg-base: #08080d;
      --bg-surface: #0e0e16;
      --bg-elevated: #14141f;
      --bg-glass: rgba(20, 20, 31, 0.6);
      --bg-glass-hover: rgba(30, 30, 45, 0.7);
      --border-subtle: rgba(255, 255, 255, 0.06);
      --border-default: rgba(255, 255, 255, 0.1);
      --border-accent: rgba(232, 121, 75, 0.25);
      --accent: #e8794b;
      --accent-bright: #f59e6b;
      --accent-glow: rgba(232, 121, 75, 0.15);
      --purple: #9146ff;
      --purple-light: #b380ff;
      --red: #ef4444;
      --red-bright: #ff5757;
      --green: #22c55e;
      --green-light: #4ade80;
      --yellow: #eab308;
      --yellow-light: #facc15;
      --text-primary: #f5ede0;
      --text-secondary: #b8b0a4;
      --text-muted: #6b6558;
      --text-dim: #4a4640;
      --font-display: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
      --shadow-glow: 0 0 24px rgba(232, 121, 75, 0.12);
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *{margin:0;padding:0;box-sizing:border-box}

    html,body{
      width:100%;height:100%;overflow:hidden;
      background:var(--bg-base);
      font-family:var(--font-body);
      color:var(--text-primary);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* Scanline texture overlay */
    body::after{
      content:'';position:fixed;inset:0;
      background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.015) 2px,rgba(0,0,0,.015) 3px);
      pointer-events:none;z-index:9999
    }

    /* Ambient glow background */
    body::before{
      content:'';position:fixed;inset:0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 0%, rgba(232,121,75,0.06), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(145,70,255,0.04), transparent);
      pointer-events:none;z-index:0;
    }

    .app{
      display:grid;
      grid-template-rows:56px 1fr 32px;
      height:100vh;
      position:relative;
      z-index:1;
    }

    /* ═══ HEADER ═══ */
    .header{
      display:flex;align-items:center;justify-content:space-between;
      padding:0 20px;
      background:var(--bg-surface);
      border-bottom:1px solid var(--border-subtle);
      backdrop-filter:blur(20px);
      position:relative;
    }
    .header::after{
      content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,var(--accent-glow),transparent);
    }

    .header-left{display:flex;align-items:center;gap:16px}

    .logo{
      font-family:var(--font-display);
      font-size:20px;font-weight:700;
      color:var(--accent);
      letter-spacing:1px;
      text-shadow:0 0 20px var(--accent-glow);
    }
    .logo span{color:var(--text-primary);font-weight:400}

    .live-badge{
      background:linear-gradient(135deg,var(--red),var(--red-bright));
      color:#fff;font-size:10px;font-weight:700;
      padding:3px 10px;border-radius:var(--radius-sm);
      animation:pulse 2s infinite;letter-spacing:1px;
      box-shadow:0 0 12px rgba(239,68,68,0.3);
    }
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

    .status-pills{display:flex;gap:6px}
    .pill{
      font-size:10px;padding:3px 10px;
      border-radius:12px;font-weight:600;
      display:flex;align-items:center;gap:4px;
      transition:var(--transition);
    }
    .pill-ok{
      background:rgba(34,197,94,0.1);
      color:var(--green-light);
      border:1px solid rgba(34,197,94,0.15);
    }
    .pill-ok:hover{background:rgba(34,197,94,0.15)}
    .pill-warn{
      background:rgba(234,179,8,0.1);
      color:var(--yellow-light);
      border:1px solid rgba(234,179,8,0.15);
    }

    .header-right{display:flex;align-items:center;gap:16px}
    .clock{
      font-family:var(--font-mono);
      font-size:14px;font-weight:500;
      color:var(--accent);
      letter-spacing:1px;
    }

    .login-btn{
      background:linear-gradient(135deg,rgba(145,70,255,0.15),rgba(145,70,255,0.08));
      color:var(--purple-light);
      border:1px solid rgba(145,70,255,0.25);
      padding:6px 16px;border-radius:var(--radius-sm);
      font-size:12px;font-weight:600;cursor:pointer;
      font-family:var(--font-body);
      transition:var(--transition);
    }
    .login-btn:hover{
      background:linear-gradient(135deg,rgba(145,70,255,0.25),rgba(145,70,255,0.12));
      border-color:rgba(145,70,255,0.4);
      box-shadow:0 0 16px rgba(145,70,255,0.15);
    }

    .user-info{display:flex;align-items:center;gap:10px}
    .user-avatar{
      width:28px;height:28px;border-radius:50%;
      border:2px solid var(--purple);
      box-shadow:0 0 8px rgba(145,70,255,0.2);
    }
    .user-name{font-size:13px;font-weight:600;color:var(--purple-light)}
    .logout-btn{
      background:none;border:none;
      color:var(--text-muted);
      font-size:11px;cursor:pointer;
      font-family:var(--font-body);
      transition:var(--transition);
      padding:2px 6px;border-radius:4px;
    }
    .logout-btn:hover{color:var(--accent);background:rgba(232,121,75,0.08)}

    /* ═══ MAIN LAYOUT ═══ */
    .main{
      display:grid;
      grid-template-columns:1fr 440px;
      overflow:hidden;
    }

    .left-panel{
      display:grid;
      grid-template-rows:1fr 220px;
      overflow:hidden;
      border-right:1px solid var(--border-subtle);
    }

    /* ═══ STREAM AREA ═══ */
    .stream-area{
      position:relative;min-height:0;
      background:#000;
      overflow:hidden;
    }
    .stream-area iframe{width:100%;height:100%;border:none}

    .stream-overlay{
      position:absolute;top:12px;left:12px;
      display:flex;gap:8px;z-index:10;pointer-events:none;
    }
    .overlay-badge{
      background:rgba(8,8,13,0.75);
      backdrop-filter:blur(12px);
      padding:5px 12px;border-radius:var(--radius-sm);
      font-size:11px;font-weight:600;
      border:1px solid var(--border-default);
    }
    .overlay-studio{
      color:var(--accent);
      border-color:rgba(232,121,75,0.3);
      text-shadow:0 0 8px var(--accent-glow);
    }
    .overlay-cast{color:var(--text-secondary)}

    .vod-badge{
      background:linear-gradient(135deg,rgba(139,92,246,0.85),rgba(124,58,237,0.85));
      color:#fff;font-size:10px;font-weight:700;
      padding:3px 10px;border-radius:var(--radius-sm);
      box-shadow:0 0 12px rgba(139,92,246,0.2);
    }

    .back-live-btn{
      position:absolute;top:12px;right:12px;
      background:linear-gradient(135deg,rgba(239,68,68,0.9),rgba(220,38,38,0.9));
      color:#fff;border:none;
      padding:6px 14px;border-radius:var(--radius-sm);
      font-size:11px;font-weight:700;cursor:pointer;
      z-index:10;font-family:var(--font-body);
      display:none;
      transition:var(--transition);
      box-shadow:0 2px 12px rgba(239,68,68,0.2);
    }
    .back-live-btn:hover{
      background:linear-gradient(135deg,var(--red),var(--red-bright));
      box-shadow:0 4px 16px rgba(239,68,68,0.3);
    }

    .stream-bottom{
      position:absolute;bottom:0;left:0;right:0;
      background:linear-gradient(transparent,rgba(0,0,0,0.85));
      padding:16px 20px 10px;
      display:flex;justify-content:space-between;align-items:flex-end;
      pointer-events:none;z-index:10;
    }
    .stream-now{font-size:12px;color:var(--text-muted)}
    .stream-now strong{color:var(--accent);font-weight:600}

    /* ═══ COMMENTARY PANEL ═══ */
    .commentary-panel{
      display:flex;flex-direction:column;
      background:var(--bg-surface);
      border-top:1px solid var(--border-subtle);
    }
    .commentary-header{
      display:flex;align-items:center;justify-content:space-between;
      padding:8px 16px;
      border-bottom:1px solid var(--border-subtle);
      flex-shrink:0;
      background:var(--bg-elevated);
    }
    .commentary-header h3{
      font-family:var(--font-mono);
      font-size:11px;color:var(--accent);
      letter-spacing:1.5px;font-weight:700;
    }

    .commentary-feed{
      flex:1;overflow-y:auto;
      padding:8px 16px;
      display:flex;flex-direction:column;gap:6px;
    }
    .feed-item{
      display:flex;gap:10px;
      padding:8px 10px;
      border-radius:var(--radius-md);
      background:var(--bg-glass);
      border:1px solid var(--border-subtle);
      font-size:12px;line-height:1.5;
      transition:var(--transition);
      animation:feedSlideIn 0.3s ease-out;
    }
    @keyframes feedSlideIn{
      from{opacity:0;transform:translateY(8px)}
      to{opacity:1;transform:translateY(0)}
    }
    .feed-item:hover{
      background:var(--bg-glass-hover);
      border-color:var(--border-accent);
    }
    .feed-avatar{
      width:32px;height:32px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:11px;font-weight:700;color:#fff;
      flex-shrink:0;
      box-shadow:0 2px 8px rgba(0,0,0,0.3);
    }
    .feed-body{flex:1;min-width:0}
    .feed-name{font-weight:600;font-size:11px;margin-bottom:2px;color:var(--text-primary)}
    .feed-name .feed-role{font-weight:400;color:var(--text-muted);margin-left:6px;font-size:10px}
    .feed-text{color:var(--text-secondary)}
    .feed-time{
      font-size:10px;color:var(--text-dim);
      flex-shrink:0;font-family:var(--font-mono);
    }

    /* ═══ SIDEBAR ═══ */
    .sidebar{
      background:var(--bg-surface);
      overflow:hidden;
      display:flex;flex-direction:column;
    }
    .sidebar-scroll{flex:1;overflow-y:auto;min-height:0}

    .sidebar-section{
      padding:14px 16px;
      border-bottom:1px solid var(--border-subtle);
    }
    .sidebar-section h3{
      font-family:var(--font-mono);
      font-size:10px;color:var(--accent);
      margin-bottom:10px;letter-spacing:1.5px;font-weight:700;
      display:flex;align-items:center;gap:6px;
    }

    /* ON AIR card */
    .on-air-card{
      background:linear-gradient(135deg,rgba(239,68,68,0.06),rgba(239,68,68,0.02));
      border:1px solid rgba(239,68,68,0.15);
      border-radius:var(--radius-md);
      padding:12px;
      position:relative;overflow:hidden;
    }
    .on-air-card::before{
      content:'';position:absolute;top:0;left:0;right:0;height:2px;
      background:linear-gradient(90deg,transparent,var(--red),transparent);
    }
    .on-air-studio{font-size:16px;font-weight:700;color:var(--text-primary);margin-bottom:3px}
    .on-air-hint{font-size:11px;color:var(--text-muted);margin-bottom:10px;line-height:1.4}
    .on-air-char{
      display:flex;align-items:center;gap:10px;
      padding:8px;
      background:rgba(255,255,255,0.02);
      border-radius:var(--radius-sm);
      margin-bottom:5px;
      transition:var(--transition);
    }
    .on-air-char:hover{background:rgba(255,255,255,0.04)}
    .char-av{
      width:34px;height:34px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:13px;font-weight:700;color:#fff;
      flex-shrink:0;
      box-shadow:0 2px 8px rgba(0,0,0,0.3);
    }
    .char-info{flex:1;min-width:0}
    .char-name{font-size:13px;font-weight:600;color:var(--text-primary)}
    .char-sub{font-size:10px;color:var(--text-muted)}
    .char-role{font-size:11px;color:var(--accent)}

    /* Schedule */
    .sched-grid{display:flex;flex-direction:column;gap:3px}
    .sched-slot{
      display:grid;grid-template-columns:46px 1fr;gap:10px;
      padding:8px 10px;
      border-radius:var(--radius-sm);
      background:rgba(255,255,255,0.02);
      border:1px solid var(--border-subtle);
      font-size:11px;
      transition:var(--transition);
    }
    .sched-slot:hover{
      background:rgba(232,121,75,0.04);
      border-color:var(--border-accent);
    }
    .sched-slot.live{
      background:rgba(239,68,68,0.06);
      border-color:rgba(239,68,68,0.25);
      box-shadow:0 0 12px rgba(239,68,68,0.05);
    }
    .sched-slot.prime{border-left:3px solid var(--accent)}
    .sched-slot.past{opacity:0.35}
    .sched-time{
      font-family:var(--font-mono);
      color:var(--text-muted);
      display:flex;align-items:center;
      font-size:11px;font-weight:500;
    }
    .sched-slot.live .sched-time{color:var(--red-bright);font-weight:700}
    .sched-body{display:flex;flex-direction:column;gap:2px}
    .sched-studio{font-weight:700;color:var(--text-primary);font-size:12px}
    .sched-cast{display:flex;gap:4px;flex-wrap:wrap}
    .sched-chip{
      font-size:9px;padding:2px 6px;
      border-radius:8px;
      background:rgba(255,255,255,0.05);
      color:var(--text-secondary);
      font-weight:500;
    }
    .sched-chip.lead{
      background:rgba(232,121,75,0.12);
      color:var(--accent);
      font-weight:600;
    }
    .live-dot{
      width:6px;height:6px;background:var(--red);
      border-radius:50%;animation:pulse 1.5s infinite;
      display:inline-block;margin-right:4px;
      box-shadow:0 0 6px rgba(239,68,68,0.4);
    }
    .lang-tag{
      font-size:9px;font-weight:700;
      padding:2px 5px;border-radius:3px;
      letter-spacing:.5px;margin-left:5px;
    }
    .lang-ru{background:rgba(59,130,246,0.12);color:#60a5fa}
    .lang-en{background:rgba(16,185,129,0.12);color:#34d399}

    /* Channel items */
    .channel-item{
      display:flex;align-items:center;gap:10px;
      padding:8px 10px;
      border-radius:var(--radius-sm);
      cursor:pointer;
      transition:var(--transition);
      border:1px solid transparent;
    }
    .channel-item:hover{
      background:rgba(145,70,255,0.06);
      border-color:rgba(145,70,255,0.1);
    }
    .channel-item.active{
      background:rgba(145,70,255,0.1);
      border-color:rgba(145,70,255,0.2);
    }
    .channel-live-dot{
      width:9px;height:9px;border-radius:50%;
      flex-shrink:0;
    }
    .channel-live-dot.online{
      background:var(--red);
      animation:pulse 1.5s infinite;
      box-shadow:0 0 6px rgba(239,68,68,0.4);
    }
    .channel-live-dot.offline{background:var(--text-dim)}
    .channel-info{flex:1;min-width:0}
    .channel-name{font-size:13px;font-weight:600;color:var(--text-primary)}
    .channel-game{
      font-size:10px;color:var(--text-muted);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .channel-viewers{
      font-size:10px;color:var(--red-bright);
      font-family:var(--font-mono);font-weight:600;
    }

    /* VOD items */
    .vod-item{
      display:flex;align-items:center;gap:8px;
      padding:7px 10px;
      border-radius:var(--radius-sm);
      cursor:pointer;
      transition:var(--transition);
      font-size:11px;
      border:1px solid transparent;
    }
    .vod-item:hover{
      background:rgba(139,92,246,0.06);
      border-color:rgba(139,92,246,0.1);
    }
    .vod-item.active{
      background:rgba(139,92,246,0.1);
      border-color:rgba(139,92,246,0.15);
    }
    .vod-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .vod-dot.watched{background:rgba(34,197,94,0.5)}
    .vod-dot.current{background:var(--red);animation:pulse 1.5s infinite;box-shadow:0 0 6px rgba(239,68,68,0.4)}
    .vod-dot.pending{background:var(--text-dim)}
    .vod-title{
      color:var(--text-secondary);flex:1;min-width:0;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .vod-game{font-size:9px;color:var(--text-dim)}

    /* Chat */
    .chat-section{
      flex-shrink:0;height:50vh;
      display:flex;flex-direction:column;
      border-top:2px solid rgba(232,121,75,0.2);
      background:var(--bg-elevated);
    }
    .chat-section h3{
      padding:10px 16px 0;
    }
    #chat-container{
      flex:1;min-height:0;
      display:flex;flex-direction:column;
      padding:0 16px 16px;
    }
    .chat-embed{
      flex:1;min-height:400px;
      border-radius:var(--radius-md);
      overflow:hidden;
      border:1px solid var(--border-subtle);
    }
    .chat-embed iframe{width:100%;height:100%;border:none}

    /* Drag handle */
    .drag-handle{
      height:6px;cursor:row-resize;
      background:rgba(232,121,75,0.1);
      flex-shrink:0;position:relative;
      transition:var(--transition);
    }
    .drag-handle:hover,.drag-handle.active{
      background:rgba(232,121,75,0.3);
    }
    .drag-handle::after{
      content:'';position:absolute;top:50%;left:50%;
      transform:translate(-50%,-50%);
      width:36px;height:2px;
      background:rgba(232,121,75,0.4);
      border-radius:1px;
    }

    /* Collapsible sections */
    .sidebar-section.collapsible .section-toggle{cursor:pointer;user-select:none}
    .sidebar-section.collapsible .section-toggle::before{content:'▼ ';font-size:8px;margin-right:4px}
    .sidebar-section.collapsed .section-toggle::before{content:'▶ '}
    .sidebar-section.collapsed .section-content{display:none}

    /* ═══ TICKER ═══ */
    .ticker{
      display:flex;align-items:center;
      background:linear-gradient(90deg,var(--accent),var(--accent-bright));
      color:var(--bg-base);
      font-weight:700;font-size:11px;letter-spacing:.5px;
      overflow:hidden;
      box-shadow:0 -2px 12px rgba(232,121,75,0.1);
    }
    .ticker-label{
      background:var(--bg-base);
      color:var(--accent);
      padding:0 14px;
      font-family:var(--font-mono);
      font-size:10px;letter-spacing:2px;
      height:100%;display:flex;align-items:center;
      font-weight:700;
    }
    .ticker-content{
      white-space:nowrap;
      animation:scroll 80s linear infinite;
      padding-left:100%;
    }
    @keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}

    .hidden{display:none!important}

    /* Scrollbar */
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{
      background:rgba(232,121,75,0.15);
      border-radius:3px;
    }
    ::-webkit-scrollbar-thumb:hover{background:rgba(232,121,75,0.3)}
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-left">
      <div class="logo">MOM <span>TV</span></div>
      <div class="live-badge" id="live-badge">● LIVE</div>
      <div class="status-pills">
        <span class="pill pill-ok" id="pill-watcher">Watcher ✓</span>
        <span class="pill pill-ok" id="pill-analyzer">Analyzer ✓</span>
        <span class="pill pill-ok" id="pill-vi">VI ✓</span>
      </div>
    </div>
    <div class="header-right">
      <div id="auth-section">
        <button class="login-btn" id="login-btn" onclick="twitchLogin()">🔑 Login with Twitch</button>
      </div>
      <div class="clock" id="clock">--:--:--</div>
    </div>
  </div>

  <div class="main">
    <div class="left-panel">
      <div class="stream-area">
        <iframe id="stream-embed" allowfullscreen allow="autoplay; fullscreen; encrypted-media; picture-in-picture"></iframe>
        <div class="stream-overlay">
          <div class="overlay-badge overlay-studio" id="overlay-studio">MOM TV</div>
          <div class="overlay-badge overlay-cast" id="overlay-cast">Loading...</div>
          <div class="vod-badge" id="vod-badge" style="display:none">VOD</div>
        </div>
        <button class="back-live-btn" id="back-live-btn" onclick="switchToLive()">← Back to LIVE</button>

function twitchLogin() {
  // Need a registered client ID for OAuth
  let cid = OAUTH_CLIENT_ID;
  if (!cid) {
    cid = prompt(
      "Twitch OAuth requires a registered Client ID.\n\n" +
      "1. Go to https://dev.twitch.tv/console/apps\n" +
      "2. Create an application (name: MOM TV)\n" +
      "3. Set OAuth Redirect URL to: " + REDIRECT_URI + "\n" +
      "4. Copy the Client ID and paste it here:\n\n" +
      "(It will be saved in your browser for next time)"
    );
    if (!cid) return;
    localStorage.setItem("momtv_custom_client_id", cid.trim());
  }
  const state = Math.random().toString(36).slice(2);
  sessionStorage.setItem("twitch_oauth_state", state);
  const url = `https://id.twitch.tv/oauth2/authorize?client_id=${cid.trim()}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${encodeURIComponent(SCOPES)}&state=${state}`;
  window.location.href = url;
}

function twitchLogout() {
  twitchToken = null; twitchUser = null;
  localStorage.removeItem(TOKEN_KEY);
  updateAuthUI();
  disconnectIRC();
  document.getElementById("followed-section").classList.add("hidden");
}

function checkOAuthRedirect() {
  const hash = window.location.hash;
  if (!hash.includes("access_token")) return false;
  const params = new URLSearchParams(hash.substring(1));
  const token = params.get("access_token");
  const state = params.get("state");
  if (state !== sessionStorage.getItem("twitch_oauth_state")) return false;
  if (token) {
    twitchToken = token;
    localStorage.setItem(TOKEN_KEY, token);
    window.history.replaceState(null, "", window.location.pathname);
    return true;
  }
  return false;
}

async function validateToken() {
  if (!twitchToken) return false;
  // Try to get user info via Helix API (avoids CORS issue with /oauth2/validate)
  const cid = getAuthClientId();
  try {
    const res = await fetch("https://api.twitch.tv/helix/users", {
      headers: { "Authorization": `Bearer ${twitchToken}`, "Client-Id": cid }
    });
    if (!res.ok) { twitchLogout(); return false; }
    const data = await res.json();
    if (data.data && data.data.length > 0) {
      twitchUser = { id: data.data[0].id, login: data.data[0].login };
      return true;
    }
    twitchLogout();
    return false;
  } catch { twitchLogout(); return false; }
}

}

async function helixGet(endpoint) {
  const headers = { "Client-Id": getAuthClientId() };
  if (twitchToken) headers["Authorization"] = `Bearer ${twitchToken}`;
  const res = await fetch(`https://api.twitch.tv/helix/${endpoint}`, { headers });
  if (!res.ok) throw new Error(`Twitch API ${res.status}`);
  return (await res.json()).data;
}

async function gqlQuery(query, variables) {
  const headers = { "Client-Id": GQL_CLIENT_ID, "Content-Type": "application/json" };
  const res = await fetch("https://gql.twitch.tv/gql", {
    method: "POST", headers, body: JSON.stringify({ query, variables })
  });
  return (await res.json()).data;
}

    }));

function connectIRC(channel) {
  disconnectIRC();
  if (!twitchToken) return;
  try {
    ircWs = new WebSocket("wss://irc-ws.chat.twitch.tv:443");
    ircWs.onopen = () => {
      ircWs.send(`PASS oauth:${twitchToken}`);
      ircWs.send(`NICK ${twitchUser?.login || "justinfan12345"}`);
      ircWs.send(`JOIN #${channel}`);
      console.log(`[IRC] Connected to #${channel}`);
    };
    ircWs.onmessage = (e) => {
      const lines = e.data.split("\r\n");
      for (const line of lines) {
        if (line.includes("PRIVMSG")) {
          const match = line.match(/:(\w+)!\w+@\w+\.tmi\.twitch\.tv PRIVMSG #\w+ :(.+)/);
          if (match) addIRCMessage(match[1], match[2]);
        }
        if (line.startsWith("PING")) ircWs.send("PONG :tmi.twitch.tv");
      }
    };
    ircWs.onclose = () => console.log("[IRC] Disconnected");
    ircWs.onerror = (e) => console.warn("[IRC] Error:", e);
  } catch (e) { console.warn("[IRC] Connection failed:", e); }
}

function disconnectIRC() {
  if (ircWs) { ircWs.close(); ircWs = null; }
}

function addIRCMessage(user, text) {
  const el = document.getElementById("chat-container");
  if (!el || !el.querySelector(".irc-chat")) return;
  const chat = el.querySelector(".irc-chat");
  const colors = ["#ff6b6b","#ffd93d","#6bcb77","#4d96ff","#ff6bff","#ff9f43","#a29bfe","#fd79a8"];
  const color = colors[user.charCodeAt(0) % colors.length];
  const msg = document.createElement("div");
  msg.className = "irc-msg";
  msg.innerHTML = `<span class="irc-user" style="color:${color}">${user}</span>: ${escapeHtml(text)}`;
  chat.appendChild(msg);
  while (chat.children.length > 200) chat.removeChild(chat.firstChild);
  chat.scrollTop = chat.scrollHeight;
}

function escapeHtml(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

    const input = `Generate a ${showType} commentary for the current live stream on ${studio}. The stream is "${currentChannel}". Viewers are watching a live Twitch stream. Cast: ${castNames}. Provide a brief 2-3 line dialogue exchange. Language: Russian mixed with English gaming terms.`;

    const res = await fetch(`${API_BASE}/api/agents/stream-director`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "gpt-4o-mini", input: input, tools: [] })
    });

    if (!res.ok) throw new Error(`Agent API ${res.status}`);
    const data = await res.json();
    parseAndDisplayAgentResponse(data);
  } catch (e) {
    console.warn("[Commentary] Agent call failed:", e);
    // Fallback: use local templates with current slot characters
    useFallbackCommentary();
  } finally {
    commentaryInFlight = false;
  }
}

function parseAndDisplayAgentResponse(data) {
  // OpenAI Responses API format: data.output[0].content[0].text
  let text = "";
  if (data.output) {
    for (const item of data.output) {
      if (item.type === "message" && item.content) {
        for (const c of item.content) {
          if (c.type === "output_text") text += c.text;
        }
      }
    }
  }
  if (!text) { useFallbackCommentary(); return; }

  // Try to parse as AnchorScript JSON
  try {
    const script = JSON.parse(text);
    if (script.dialogue && Array.isArray(script.dialogue)) {
      script.dialogue.forEach((line, i) => {
        setTimeout(() => {
          const info = CHARACTER_NAMES[line.speaker] || { name: line.speaker || "Anchor", latin: line.speaker || "Anchor", role: "Anchor" };
          const color = CHARACTER_COLORS[line.speaker] || "#e8794b";
          addFeedItem(info.role, info.name, color, line.text, "character");
        }, i * 2000);
      });
      if (script.ticker) {
        document.getElementById("ticker-text").textContent = script.ticker;
      }
      return;
    }
  } catch {}

  // Not JSON — treat as plain text, split into lines
  const lines = text.split("\n").filter(l => l.trim());
  const slot = getCurrentSlot();
  const char = slot && slot.cast[0] ? slot.cast[0] : { name: "Алексей Орлов", color: "#3b82f6", role: "Anchor" };
  lines.slice(0, 3).forEach((line, i) => {
    setTimeout(() => {
      addFeedItem(char.role, char.name, char.color, line.trim(), "character");
    }, i * 2000);
  });
}

function getCurrentSlot() {
  const h = new Date().getHours();
  return SCHEDULE.slots.find(s => s.hour === h) || null;
}

let visionInFlight = false;

async function runVisualAnalysis() {
  if (visionInFlight || !isLive) return;
  visionInFlight = true;
  try {
    const iframe = document.getElementById("stream-embed");
    if (!iframe || !iframe.src) { visionInFlight = false; return; }
    const channel = currentChannel;

    const res = await fetch(`${API_BASE}/api/vision`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "api-key": FOUNDRY_KEY },
      body: JSON.stringify({
        channel,
        prompt: "Describe what's happening on screen in this Twitch stream. Focus on: game being played, visible text/UI elements, player actions, viewer reactions. Be concise, 1-2 sentences."
      })
    });

    if (!res.ok) throw new Error(`Vision API ${res.status}`);
    const data = await res.json();
    const description = data.description || data.text || data.analysis || "";

    if (description) {
      addFeedItem("Analyzer", "Stream Analyzer", "#3b82f6", description, "analyzer");
    }
  } catch (e) {
    console.warn("[Vision] Analysis failed:", e); useFallbackVisionAnalysis();
  } finally {
    visionInFlight = false;
  }
}

// ═══ VIDEO INDEXER ═══

let viInFlight = false;

async function runVIAnalysis() {
  if (viInFlight) return;
  viInFlight = true;
  try {
    const res = await fetch(`${API_BASE}/api/video-indexer/search?query=${encodeURIComponent(currentChannel)}&top=1`);
    if (!res.ok) throw new Error(`VI API ${res.status}`);
    const data = await res.json();
    const videos = data.results || data.videos || [];

    if (videos.length > 0) {
      const video = videos[0];
      const topics = video.topics || video.labels || [];
      const transcript = video.transcript || video.description || "";
      const summary = video.summary || video.title || "";

      let text = "";
      if (topics.length > 0) text += `Topics: ${topics.slice(0, 3).join(", ")}. `;
      if (summary) text += summary;
      if (!text && transcript) text = transcript.slice(0, 120);

      if (text) {
        addFeedItem("VI", "Video Indexer", "#a855f7", text, "vi");
      }
    }
  } catch (e) {
    console.warn("[VI] Analysis failed:", e); useFallbackVI();
  } finally {
    viInFlight = false;
  }
}

async function runWatcherReport() {

      body: JSON.stringify({
        input: `Generate a brief system status report for the live stream. Channel: ${currentChannel}, Game: ${game}, Viewers: ${viewers}, Title: "${title.slice(0, 60)}". Just 1-2 sentences about the stream health and viewer engagement.`,
        model: "gpt-4o-mini", tools: []
      })
    });

    if (!res.ok) throw new Error(`Agent API ${res.status}`);
    const data = await res.json();
    let text = "";
    if (data.output) {
      for (const item of data.output) {
        if (item.type === "message" && item.content) {
          for (const c of item.content) {

function renderSchedule() {
  const grid = document.getElementById("schedule-grid");
  const h = new Date().getHours();
  grid.innerHTML = SCHEDULE.slots.map(s => {
    const live = s.hour===h, past = s.hour<h;

    const cast = s.cast.map(c=>`<span class="sched-chip${c.lead?" lead":""}">${c.latin}</span>`).join("");
    return `<div class="${cls}"><div class="sched-time">${live?'<span class="live-dot"></span>':''}${s.hour}:00</div><div class="sched-body"><div><span class="sched-studio">${s.studio}</span><span class="lang-tag lang-${s.lang}">${s.lang.toUpperCase()}</span>${s.event?` <span style="color:var(--accent);font-size:9px">${s.event}</span>`:''}</div><div class="sched-cast">${cast}</div></div></div>`;
  }).join("");
}

function renderOnAir() {
  const h = new Date().getHours();
  const slot = SCHEDULE.slots.find(s=>s.hour===h);
  const el = document.getElementById("on-air");
  if (!slot) {
    el.innerHTML='<div style="color:var(--text-dim);font-size:11px;padding:10px;text-align:center">Off air</div>';
    return;
  }
  document.getElementById("overlay-studio").textContent=slot.studio;
  document.getElementById("overlay-cast").textContent=slot.cast.map(c=>c.latin).join(" + ");
  el.innerHTML=`<div class="on-air-studio">${slot.studio}</div><div class="on-air-hint">${slot.hint}</div>${slot.cast.map(c=>`<div class="on-air-char"><div class="char-av" style="background:${c.color}">${c.latin.split(" ").map(w=>w[0]).join("")}</div><div class="char-info"><div class="char-name">${c.name}</div><div class="char-sub">${c.latin}</div><div class="char-role">${c.role}</div></div></div>`).join('')}`;
}

async function checkStream() {
  const user = await fetchStreamStatus(currentChannel);
  if (!user) return;
  const live = user.stream?.type === "live";
  if (live && !isLive) {
    embedStream(currentChannel);
    document.getElementById("stream-now").innerHTML = `<strong>${currentChannel}</strong> — ${user.stream.game?.displayName||""} — ${(user.stream.viewersCount||0).toLocaleString()} viewers`;
  } else if (!live && isLive) {
    // Go to VODs
    await loadVods(currentChannel);
    if (allVods.length > 0) {
      const unwatched = getUnwatchedVods(allVods);
      const next = unwatched[0] || allVods[0];
      if (next) embedVod(next.id, next.title, currentChannel);
    }
  } else if (live) {
    document.getElementById("stream-now").innerHTML = `<strong>${currentChannel}</strong> — ${user.stream.game?.displayName||""} — ${(user.stream.viewersCount||0).toLocaleString()} viewers`;
  }
}

// ═══ SETTINGS PERSISTENCE ═══
const SETTINGS_KEY = "momtv_settings";
const DEFAULT_SETTINGS = { chatHeightVh: 50, sidebarWidth: 440, channel: DEFAULT_CHANNEL };
let settings = { ...DEFAULT_SETTINGS };

function loadSettings() {
  try {
    const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
    settings = { ...DEFAULT_SETTINGS, ...saved };
  } catch { settings = { ...DEFAULT_SETTINGS }; }
  applySettings();
}

function saveSettings() {
  settings.channel = currentChannel;
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
}

function applySettings() {
  const chatSection = document.getElementById("chat-section");
  if (chatSection) chatSection.style.height = `${settings.chatHeightVh}vh`;
  const main = document.querySelector(".main");
  if (main) main.style.gridTemplateColumns = `1fr ${settings.sidebarWidth}px`;
}

// ═══ DRAG HANDLE ═══
function initDragHandle() {
  const handle = document.getElementById("sidebar-drag");
  const chatSection = document.getElementById("chat-section");
  const sidebar = document.querySelector(".sidebar");
  if (!handle || !chatSection || !sidebar) return;

  let startY = 0, startHeight = 0, sidebarH = 0;

  handle.addEventListener("mousedown", (e) => {
    e.preventDefault();
    handle.classList.add("active");
    startY = e.clientY;
    startHeight = chatSection.offsetHeight;
    sidebarH = sidebar.offsetHeight;

    const onMove = (ev) => {
      const delta = startY - ev.clientY;
      const newChatH = Math.max(100, Math.min(sidebarH - 100, startHeight + delta));
      const vh = (newChatH / window.innerHeight) * 100;
      chatSection.style.height = `${vh}vh`;
      settings.chatHeightVh = Math.round(vh);
    };

    const onUp = () => {
      handle.classList.remove("active");
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      saveSettings();
    };

    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
}

  // Check OAuth redirect
  checkOAuthRedirect();

  // Restore token
  if (!twitchToken) twitchToken = localStorage.getItem(TOKEN_KEY);

  // Validate
  if (twitchToken) {
    const valid = await validateToken();
    if (valid) {
      updateAuthUI();
      await loadFollowedChannels();

  // Load saved settings and init drag handle
  loadSettings();
  initDragHandle();

  // Embed default stream
  embedStream(settings.channel || DEFAULT_CHANNEL);
  await loadVods(DEFAULT_CHANNEL);
  renderSchedule();
  renderOnAir();
  updateClock();
