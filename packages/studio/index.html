<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOM TV - Always-On Live Stream Viewer</title>
<meta name="description" content="MOM TV is an always-on Twitch viewer with followed channels, VOD queue, live chat and viewer analytics.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230b0a10'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='%23ffb454' font-family='monospace'>M</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Russo+One&family=Changa:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0a10;--bg-soft:#121019;--panel:#17141f;--panel-2:#1d1928;
    --text:#e8e4dc;--text-muted:#8f8a9e;
    --amber:#ffb454;--amber-dim:rgba(255,180,84,0.14);
    --purple:#9146ff;--purple-light:#b98bff;--phosphor:#7cfc98;
    --radius:14px;--radius-sm:8px;
    --font-display:VT323,monospace;
    --font-body:Inter,system-ui,sans-serif;
    --font-mono:JetBrains Mono,monospace;
    --transition:all .2s ease;
  }
  html[lang="ru"]{--font-display:"Russo One",Inter,sans-serif}
  html[lang="ar"]{
    --font-display:Changa,Inter,sans-serif;
    --font-body:Changa,Inter,system-ui,sans-serif;
  }
  html[lang="ar"] .logo,html[lang="ar"] h1,html[lang="ar"] .ticker-label{letter-spacing:0}
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;overflow-x:hidden}  /* CRT atmosphere */
  .scanlines{
    position:fixed;inset:0;pointer-events:none;z-index:60;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0.22) 0px,rgba(0,0,0,0.22) 1px,transparent 1px,transparent 3px);
    mix-blend-mode:multiply;opacity:.5;
  }
  .vignette{
    position:fixed;inset:0;pointer-events:none;z-index:59;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,0.55) 100%);
  }
  header{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:16px clamp(20px,5vw,56px);
    border-bottom:1px solid rgba(255,255,255,0.06);
    background:rgba(11,10,16,0.8);
    backdrop-filter:blur(10px);
    position:sticky;top:0;z-index:50;
  }
  .logo{
    font-family:var(--font-display);
    font-size:clamp(24px,3vw,32px);letter-spacing:3px;
    color:var(--amber);text-shadow:0 0 14px rgba(255,180,84,0.45);
    white-space:nowrap;
  }
  .logo span{color:var(--purple-light);text-shadow:0 0 14px rgba(145,70,255,0.5)}
  .header-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
  .lang-pills{
    display:flex;gap:4px;
    border:1px solid rgba(255,255,255,0.1);
    border-radius:999px;padding:3px;
    background:var(--bg-soft);
  }
  .lang-pill{
    font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.5px;
    color:var(--text-muted);background:transparent;
    border:none;border-radius:999px;padding:5px 12px;cursor:pointer;
    transition:var(--transition);
  }
  .lang-pill:hover{color:var(--text)}
  .lang-pill.active{
    color:var(--amber);
    background:var(--amber-dim);
    box-shadow:inset 0 0 0 1px rgba(255,180,84,0.4);
  }
  .watch-btn{
    display:inline-flex;align-items:center;gap:8px;
    background:linear-gradient(180deg,rgba(145,70,255,0.32),rgba(145,70,255,0.16));
    color:var(--purple-light);
    border:1px solid rgba(145,70,255,0.5);
    padding:9px 20px;border-radius:var(--radius-sm);
    font-family:var(--font-body);font-size:14px;font-weight:700;
    cursor:pointer;text-decoration:none;letter-spacing:.3px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.1),0 2px 10px rgba(0,0,0,0.4);
    transition:var(--transition);white-space:nowrap;
  }
  .watch-btn:hover{
    background:linear-gradient(180deg,rgba(145,70,255,0.45),rgba(145,70,255,0.24));
    box-shadow:0 0 20px rgba(145,70,255,0.35),inset 0 1px 0 rgba(255,255,255,0.12);
    transform:translateY(-1px);
  }
  .lang-suggest{
    display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
    padding:10px clamp(20px,5vw,56px);
    background:linear-gradient(90deg,rgba(255,180,84,0.1),rgba(145,70,255,0.08));
    border-bottom:1px solid rgba(255,180,84,0.25);
    font-size:13.5px;color:var(--text);
  }
  .lang-suggest.hidden{display:none}
  .lang-suggest button{
    font-family:var(--font-body);font-size:12.5px;font-weight:700;
    padding:6px 14px;border-radius:var(--radius-sm);cursor:pointer;
    transition:var(--transition);
  }
  .suggest-yes{
    background:linear-gradient(180deg,#a55eff,#7e2ff2);color:#fff;
    border:1px solid rgba(255,255,255,0.2);
  }
  .suggest-yes:hover{box-shadow:0 0 16px rgba(145,70,255,0.5)}
  .suggest-no{
    background:transparent;color:var(--text-muted);
    border:1px solid rgba(255,255,255,0.15);
  }
  .suggest-no:hover{color:var(--text)}  /* Hero */
  .hero{text-align:center;padding:clamp(56px,9vh,100px) 20px 44px;position:relative}
  .hero::before{
    content:"";position:absolute;inset:auto 0 0 0;height:280px;pointer-events:none;
    background:radial-gradient(600px 200px at 50% 100%,rgba(145,70,255,0.12),transparent);
  }
  .status-pill{
    display:inline-flex;align-items:center;gap:8px;
    font-family:var(--font-mono);font-size:12px;letter-spacing:1px;
    color:var(--text-muted);
    border:1px solid rgba(255,255,255,0.12);
    background:var(--bg-soft);
    padding:6px 14px;border-radius:999px;
    margin-bottom:26px;
  }
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--text-muted);box-shadow:0 0 8px rgba(143,138,158,0.4)}
  .status-pill.live{color:var(--phosphor);border-color:rgba(124,252,152,0.4)}
  .status-pill.live .status-dot{background:var(--phosphor);box-shadow:0 0 10px rgba(124,252,152,0.8);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  h1{
    font-family:var(--font-display);
    font-size:clamp(60px,10vw,140px);
    line-height:.95;letter-spacing:6px;
    color:var(--amber);
    text-shadow:0 0 30px rgba(255,180,84,0.4),0 0 80px rgba(255,180,84,0.15);
    animation:power-on 1.1s ease-out;
  }
  h1 span{color:var(--purple-light);text-shadow:0 0 30px rgba(145,70,255,0.5)}
  @keyframes power-on{
    0%{opacity:0;transform:scale(1.15);filter:brightness(3) blur(6px)}
    40%{opacity:1;transform:scale(.99);filter:brightness(1.6) blur(1px)}
    60%{transform:scale(1.005)}
    100%{opacity:1;transform:scale(1);filter:none}
  }
  .tagline{max-width:640px;margin:22px auto 0;font-size:clamp(15px,1.6vw,18px);color:var(--text-muted);line-height:1.65}
  .tagline b{color:var(--text);font-weight:600}
  .hero-ctas{display:flex;gap:14px;justify-content:center;margin-top:36px;flex-wrap:wrap}
  .cta-main{
    display:inline-flex;align-items:center;gap:10px;
    background:linear-gradient(180deg,#a55eff,#7e2ff2);
    color:#fff;text-decoration:none;
    font-weight:700;font-size:16px;letter-spacing:.3px;
    padding:14px 34px;border-radius:var(--radius-sm);
    border:1px solid rgba(255,255,255,0.18);
    box-shadow:0 4px 24px rgba(145,70,255,0.4),inset 0 1px 0 rgba(255,255,255,0.25);
    transition:var(--transition);
  }
  .cta-main:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(145,70,255,0.55),inset 0 1px 0 rgba(255,255,255,0.3)}
  .cta-ghost{
    display:inline-flex;align-items:center;gap:8px;
    background:transparent;color:var(--text-muted);
    border:1px solid rgba(255,255,255,0.14);
    padding:14px 28px;border-radius:var(--radius-sm);
    font-weight:600;font-size:15px;text-decoration:none;
    transition:var(--transition);
  }
  .cta-ghost:hover{color:var(--amber);border-color:rgba(255,180,84,0.5);background:var(--amber-dim)}  /* Features */
  .features{padding:56px clamp(20px,5vw,56px) 24px;max-width:1180px;margin:0 auto}
  .section-label{
    font-family:var(--font-mono);font-size:12px;letter-spacing:3px;
    color:var(--amber);text-transform:uppercase;
    margin-bottom:20px;display:flex;align-items:center;gap:12px;
  }
  .section-label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,180,84,0.35),transparent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  .card{
    background:linear-gradient(180deg,var(--panel),var(--bg-soft));
    border:1px solid rgba(255,255,255,0.07);
    border-radius:var(--radius);
    padding:26px 24px;
    transition:var(--transition);
    position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(600px 120px at 20% 0%,rgba(145,70,255,0.08),transparent);
    pointer-events:none;
  }
  .card:hover{
    transform:translateY(-3px);
    border-color:rgba(145,70,255,0.4);
    box-shadow:0 12px 32px rgba(0,0,0,0.45),0 0 24px rgba(145,70,255,0.12);
  }
  .card-ch{
    font-family:var(--font-mono);font-size:10px;letter-spacing:2px;
    color:var(--text-muted);
    display:flex;align-items:center;gap:10px;margin-bottom:14px;
  }
  .card-ch::before{
    content:"";width:7px;height:7px;border-radius:2px;
    background:var(--purple);box-shadow:0 0 8px rgba(145,70,255,0.6);
  }
  .card h3{font-size:16px;font-weight:700;margin-bottom:8px;letter-spacing:.2px}
  .card p{font-size:13.5px;color:var(--text-muted);line-height:1.6}
  /* Sign-in strip */
  .signin{max-width:1180px;margin:26px auto 0;padding:0 clamp(20px,5vw,56px)}
  .signin-box{
    display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid rgba(255,255,255,0.08);
    border-radius:var(--radius);
    padding:24px 28px;
  }
  .signin-box .txt h3{font-size:16px;font-weight:700;margin-bottom:5px}
  .signin-box .txt p{font-size:13.5px;color:var(--text-muted)}
  .providers{display:flex;gap:10px;flex-wrap:wrap}
  .prov{
    display:inline-flex;align-items:center;gap:8px;
    font-size:13px;font-weight:600;
    padding:9px 18px;border-radius:var(--radius-sm);
    text-decoration:none;transition:var(--transition);
    border:1px solid transparent;
  }
  .prov-twitch{
    color:var(--purple-light);
    background:rgba(145,70,255,0.14);
    border-color:rgba(145,70,255,0.4);
  }
  .prov-twitch:hover{background:rgba(145,70,255,0.28);box-shadow:0 0 16px rgba(145,70,255,0.25)}
  .prov-google{
    color:#9ec0ff;
    background:rgba(66,133,244,0.14);
    border-color:rgba(66,133,244,0.4);
  }
  .prov-google:hover{background:rgba(66,133,244,0.28);box-shadow:0 0 16px rgba(66,133,244,0.25)}  /* Metrics chips */
  .metrics{
    max-width:1180px;margin:44px auto 0;
    padding:0 clamp(20px,5vw,56px);
    display:flex;flex-wrap:wrap;gap:10px;justify-content:center;
  }
  .chip{
    font-family:var(--font-mono);font-size:11.5px;letter-spacing:.5px;
    color:var(--text-muted);
    background:var(--bg-soft);
    border:1px solid rgba(255,255,255,0.08);
    padding:7px 14px;border-radius:999px;
    white-space:nowrap;
  }
  .chip b{color:var(--amber);font-weight:500}
  /* Ticker */
  .ticker{
    position:fixed;bottom:0;left:0;right:0;z-index:55;
    display:flex;align-items:stretch;
    background:rgba(13,11,18,0.94);
    border-top:1px solid rgba(255,180,84,0.25);
    backdrop-filter:blur(8px);
  }
  .ticker-label{
    font-family:var(--font-display);
    background:linear-gradient(180deg,rgba(255,180,84,0.25),rgba(255,180,84,0.12));
    color:var(--amber);
    padding:10px 18px;font-size:18px;letter-spacing:2px;
    border-right:1px solid rgba(255,180,84,0.25);
    white-space:nowrap;display:flex;align-items:center;
    text-shadow:0 0 10px rgba(255,180,84,0.4);
  }
  html[dir="rtl"] .ticker-label{border-right:none;border-left:1px solid rgba(255,180,84,0.25)}
  .ticker-viewport{overflow:hidden;flex:1;display:flex;align-items:center}
  .ticker-content{
    font-family:var(--font-mono);font-size:12.5px;color:var(--text-muted);
    white-space:nowrap;display:inline-block;padding-left:100%;
    animation:ticker-scroll 40s linear infinite;
  }
  html[dir="rtl"] .ticker-content{padding-left:0;padding-right:100%;direction:rtl}
  .ticker-content b{color:var(--text);font-weight:500}
  @keyframes ticker-scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
  /* Footer */
  footer{
    text-align:center;padding:64px 20px 90px;
    color:var(--text-muted);font-size:13px;
  }
  footer .foot-logo{font-family:var(--font-display);font-size:22px;letter-spacing:3px;color:var(--amber);margin-bottom:10px}
  footer a{color:var(--purple-light);text-decoration:none}
  footer a:hover{text-decoration:underline}
  .foot-note{margin-top:6px;font-size:12px;opacity:.7}
  @media (max-width:640px){
    .ticker-label{padding:8px 12px;font-size:15px}
    .signin-box{flex-direction:column;align-items:flex-start}
    header{flex-wrap:wrap}
  }
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="vignette"></div>

<header>
  <div class="logo">MOM <span>TV</span></div>
  <div class="header-actions">
    <div class="lang-pills" role="group" aria-label="Language">
      <button class="lang-pill active" data-lang="en" onclick="setLang('en')">EN</button>
      <button class="lang-pill" data-lang="ru" onclick="setLang('ru')">RUS</button>
      <button class="lang-pill" data-lang="ar" onclick="setLang('ar')" id="pill-ar">AR</button>
    </div>
    <a class="watch-btn" href="/tv.html" data-i18n="navWatch">Watch Live</a>
  </div>
</header>

<div class="lang-suggest hidden" id="lang-suggest">
  <span id="suggest-msg"></span>
  <button class="suggest-yes" id="suggest-yes"></button>
  <button class="suggest-no" id="suggest-no" data-i18n="suggestNo">Keep English</button>
</div>
<section class="hero">
  <div class="status-pill" id="status-pill">
    <span class="status-dot"></span>
    <span id="status-text" data-i18n="statusChecking">CHECKING SIGNAL</span>
  </div>
  <h1>MOM <span>TV</span></h1>
  <p class="tagline" data-i18n-html="tagline"></p>
  <div class="hero-ctas">
    <a class="cta-main" href="/tv.html" data-i18n="ctaWatch">Watch Live</a>
    <a class="cta-ghost" href="#features" data-i18n="ctaWhats">What is on</a>
  </div>
</section>

<section class="features" id="features">
  <div class="section-label" data-i18n="guide">PROGRAM GUIDE</div>
  <div class="grid">
    <div class="card">
      <div class="card-ch" data-i18n="ch1">CH 01</div>
      <h3 data-i18n="c1t">Always-on player</h3>
      <p data-i18n="c1p"></p>
    </div>
    <div class="card">
      <div class="card-ch" data-i18n="ch2">CH 02</div>
      <h3 data-i18n="c2t">One-click sign-in</h3>
      <p data-i18n="c2p"></p>
    </div>
    <div class="card">
      <div class="card-ch" data-i18n="ch3">CH 03</div>
      <h3 data-i18n="c3t">Followed channels</h3>
      <p data-i18n="c3p"></p>
    </div>
    <div class="card">
      <div class="card-ch" data-i18n="ch4">CH 04</div>
      <h3 data-i18n="c4t">VOD queue</h3>
      <p data-i18n="c4p"></p>
    </div>
    <div class="card">
      <div class="card-ch" data-i18n="ch5">CH 05</div>
      <h3 data-i18n="c5t">Live chat</h3>
      <p data-i18n="c5p"></p>
    </div>
    <div class="card">
      <div class="card-ch" data-i18n="ch6">CH 06</div>
      <h3 data-i18n="c6t">Auto channel sync</h3>
      <p data-i18n="c6p"></p>
    </div>
  </div>
</section>

<section class="signin">
  <div class="signin-box">
    <div class="txt">
      <h3 data-i18n="signinH"></h3>
      <p data-i18n="signinP"></p>
    </div>
    <div class="providers">
      <a class="prov prov-twitch" href="/tv.html" data-i18n="signinTwitch"></a>
      <a class="prov prov-google" href="/tv.html" data-i18n="signinGoogle"></a>
    </div>
  </div>
</section>

<div class="metrics">
  <span class="chip" data-i18n-html="chip1"></span>
  <span class="chip" data-i18n-html="chip2"></span>
  <span class="chip" data-i18n-html="chip3"></span>
  <span class="chip" data-i18n-html="chip4"></span>
  <span class="chip" data-i18n-html="chip5"></span>
  <span class="chip" data-i18n-html="chip6"></span>
</div>

<footer>
  <div class="foot-logo">MOM TV</div>
  <div><a href="/tv.html" data-i18n="footWatch">Watch live</a> - momtv.fameshire.com</div>
  <div class="foot-note" data-i18n="footNote"></div>
</footer>

<div class="ticker">
  <div class="ticker-label">MOM TV</div>
  <div class="ticker-viewport">
    <div class="ticker-content" id="ticker-text">MOM TV</div>
  </div>
</div>

  ru: {
    navWatch: "▶ Смотреть эфир",
    statusChecking: "ПРОВЕРКА СИГНАЛА…",
    statusOnair: "● В ЭФИРЕ — ТРАНСЛЯЦИЯ ИДЁТ",
    statusStandby: "ОЖИДАНИЕ — ВКЛЮЧАЙТЕСЬ В ЛЮБОЕ ВРЕМЯ",

// Suggestion bar copy, shown in the TARGET language
const SUGGEST = {
  ru: { msg: "Показать сайт по-русски?", yes: "Да, по-русски" },
  ar: { msg: "عرض الموقع بالعربية؟", yes: "نعم، بالعربية" }
};

// Countries mapped to a non-English language
const AR_COUNTRIES = new Set(["SA","AE","EG","QA","KW","BH","OM","JO","LB","IQ","SY","YE","LY","DZ","MA","TN","SD","PS"]);

const LANG_KEY = "momtv_lang";
const LANG_DISMISS_KEY = "momtv_lang_dismissed";
let currentLang = "en";
let currentStatus = "checking";
let tickerIndex = 0;

function applyLang(lang) {
  currentLang = I18N[lang] ? lang : "en";
  const t = I18N[currentLang];
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const v = t[el.getAttribute("data-i18n")];
    if (typeof v === "string") el.textContent = v;
  });
  document.querySelectorAll("[data-i18n-html]").forEach((el) => {
    const v = t[el.getAttribute("data-i18n-html")];
    if (typeof v === "string") el.innerHTML = v;
  });
  document.querySelectorAll(".lang-pill").forEach((b) =>
    b.classList.toggle("active", b.getAttribute("data-lang") === currentLang));
  renderStatus();
  tickerIndex = 0;
  renderTicker();
}

function setLang(lang, save) {
  applyLang(lang);
  if (save) {
    localStorage.setItem(LANG_KEY, currentLang);
    hideSuggest();
  }
}

function renderStatus() {
  const t = I18N[currentLang];
  const el = document.getElementById("status-text");
  if (!el) return;
  el.textContent = currentStatus === "onair" ? t.statusOnair
    : currentStatus === "standby" ? t.statusStandby : t.statusChecking;
  document.getElementById("status-pill").classList.toggle("live", currentStatus === "onair");
}

function renderTicker() {
  const t = I18N[currentLang];
  const el = document.getElementById("ticker-text");
  if (!el) return;
  el.textContent = t.ticker[tickerIndex % t.ticker.length];
}
setInterval(() => { tickerIndex++; renderTicker(); }, 30000);

// Signal check via the same-origin capture API (STANDBY when no workers run)
(async function checkSignal() {
  try {
    const res = await fetch("/api/capture/state", { cache: "no-store" });
    if (res.ok) {
      const data = await res.json();
      if (data && typeof data === "object") { currentStatus = "onair"; renderStatus(); return; }
    }
  } catch { /* fall through */ }
  currentStatus = "standby";
  renderStatus();
})();

// Language detection: saved preference, then browser language, then an
// offer based on no-permission IP geolocation (never forced).
function detectBrowserLang() {
  const nav = (navigator.language || "en").toLowerCase();
  if (nav.startsWith("ru")) return "ru";
  if (nav.startsWith("ar")) return "ar";
  return "en";
}

function showSuggest(lang) {
  const s = SUGGEST[lang];
  if (!s) return;
  document.getElementById("suggest-msg").textContent = s.msg;
  document.getElementById("suggest-yes").textContent = s.yes;
  document.getElementById("suggest-yes").onclick = () => setLang(lang, true);
  document.getElementById("suggest-no").onclick = () => {
    localStorage.setItem(LANG_DISMISS_KEY, "1");
    hideSuggest();
  };
  document.getElementById("lang-suggest").classList.remove("hidden");
}

function hideSuggest() {
  document.getElementById("lang-suggest").classList.add("hidden");
}

(async function initLang() {
  const saved = localStorage.getItem(LANG_KEY);
  if (saved && I18N[saved]) { applyLang(saved); return; }
  applyLang(detectBrowserLang());
  if (currentLang !== "en" || localStorage.getItem(LANG_DISMISS_KEY)) return;
  try {
    const res = await fetch("https://get.geojs.io/v1/ip/country.json", { cache: "no-store" });
    if (!res.ok) return;
    const geo = await res.json();
    const cc = String(geo.country || "").toUpperCase();
    const detected = (cc === "RU" || cc === "BY") ? "ru" : AR_COUNTRIES.has(cc) ? "ar" : "en";
    if (detected !== "en" && detected !== currentLang) showSuggest(detected);
  } catch { /* offline — stay with browser language */ }
})();
</script>
