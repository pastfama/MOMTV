<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOM TV — Live Stream Viewer</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    /* ═══════════════════════════════════════════════════════
       MOM TV — Simplified Stream Viewer
       ═══════════════════════════════════════════════════════ */

    :root {
      --bg-base: #08080d;
      --bg-surface: #0e0e16;
      --bg-elevated: #14141f;
      --bg-glass: rgba(20, 20, 31, 0.6);
      --bg-glass-hover: rgba(30, 30, 45, 0.7);
      --border-subtle: rgba(255, 255, 255, 0.06);
      --border-default: rgba(255, 255, 255, 0.1);
      --border-accent: rgba(232, 121, 75, 0.25);
      --accent: #e8794b;
      --accent-bright: #f59e6b;
      --accent-glow: rgba(232, 121, 75, 0.15);
      --purple: #9146ff;
      --purple-light: #b380ff;
      --red: #ef4444;
      --red-bright: #ff5757;
      --green: #22c55e;
      --green-light: #4ade80;
      --yellow: #eab308;
      --yellow-light: #facc15;
      --text-primary: #f5ede0;
      --text-secondary: #b8b0a4;
      --text-muted: #6b6558;
      --text-dim: #4a4640;
      --font-display: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
      --shadow-glow: 0 0 24px rgba(232, 121, 75, 0.12);
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *{margin:0;padding:0;box-sizing:border-box}

    html,body{
      width:100%;height:100%;overflow:hidden;
      background:var(--bg-base);
      font-family:var(--font-body);
      color:var(--text-primary);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* Scanline texture overlay */
    body::after{
      content:'';position:fixed;inset:0;
      background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.015) 2px,rgba(0,0,0,.015) 3px);
      pointer-events:none;z-index:9999
    }

    /* Ambient glow background */
    body::before{
      content:'';position:fixed;inset:0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 0%, rgba(232,121,75,0.06), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(145,70,255,0.04), transparent);
      pointer-events:none;z-index:0;
    }

    .app{
      display:grid;
      grid-template-rows:56px 1fr 32px;
      height:100vh;
      position:relative;
      z-index:1;
    }

    /* ═══ HEADER ═══ */
    .header{
      display:flex;align-items:center;justify-content:space-between;
      padding:0 20px;
      background:var(--bg-surface);
      border-bottom:1px solid var(--border-subtle);
      backdrop-filter:blur(20px);
      position:relative;
    }
    .header::after{
      content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,var(--accent-glow),transparent);
    }

    .header-left{display:flex;align-items:center;gap:16px}

    .logo{
      font-family:var(--font-display);
      font-size:20px;font-weight:700;
      color:var(--accent);
      letter-spacing:1px;
      text-shadow:0 0 20px var(--accent-glow);
    }
    .logo span{color:var(--text-primary);font-weight:400}

    .live-badge{
      background:linear-gradient(135deg,var(--red),var(--red-bright));
      color:#fff;font-size:10px;font-weight:700;
      padding:3px 10px;border-radius:var(--radius-sm);
      animation:pulse 2s infinite;letter-spacing:1px;
      box-shadow:0 0 12px rgba(239,68,68,0.3);
    }
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

    .header-right{display:flex;align-items:center;gap:16px}
    .clock{
      font-family:var(--font-mono);
      font-size:14px;font-weight:500;
      color:var(--accent);
      letter-spacing:1px;
    }

    .login-btn{
      background:linear-gradient(135deg,rgba(145,70,255,0.15),rgba(145,70,255,0.08));
      color:var(--purple-light);
      border:1px solid rgba(145,70,255,0.25);
      padding:6px 16px;border-radius:var(--radius-sm);
      font-size:12px;font-weight:600;cursor:pointer;
      font-family:var(--font-body);
      transition:var(--transition);
    }
    .login-btn:hover{
      background:linear-gradient(135deg,rgba(145,70,255,0.25),rgba(145,70,255,0.12));
      border-color:rgba(145,70,255,0.4);
      box-shadow:0 0 16px rgba(145,70,255,0.15);
    }

    .user-info{display:flex;align-items:center;gap:10px}
    .user-avatar{
      width:28px;height:28px;border-radius:50%;
      border:2px solid var(--purple);
      box-shadow:0 0 8px rgba(145,70,255,0.2);
    }
    .user-name{font-size:13px;font-weight:600;color:var(--purple-light)}
    .logout-btn{
      background:none;border:none;
      color:var(--text-muted);
      font-size:11px;cursor:pointer;
      font-family:var(--font-body);
      transition:var(--transition);
      padding:2px 6px;border-radius:4px;
    }
    .logout-btn:hover{color:var(--accent);background:rgba(232,121,75,0.08)}

    /* ═══ MAIN LAYOUT ═══ */
    .main{
      display:grid;
      grid-template-columns:1fr 400px;
      overflow:hidden;
    }

    .left-panel{
      display:flex;flex-direction:column;
      overflow:hidden;
      border-right:1px solid var(--border-subtle);
    }

    /* ═══ STREAM AREA ═══ */
    .stream-area{
      position:relative;flex:1;min-height:0;
      background:#000;
      overflow:hidden;
    }
    .stream-area iframe{width:100%;height:100%;border:none}

    .stream-overlay{
      position:absolute;top:12px;left:12px;
      display:flex;gap:8px;z-index:10;pointer-events:none;
    }
    .overlay-badge{
      background:rgba(8,8,13,0.75);
      backdrop-filter:blur(12px);
      padding:5px 12px;border-radius:var(--radius-sm);
      font-size:11px;font-weight:600;
      border:1px solid var(--border-default);
    }
    .overlay-studio{
      color:var(--accent);
      border-color:rgba(232,121,75,0.3);
      text-shadow:0 0 8px var(--accent-glow);
    }
    .overlay-cast{color:var(--text-secondary)}

    .vod-badge{
      background:linear-gradient(135deg,rgba(139,92,246,0.85),rgba(124,58,237,0.85));
      color:#fff;font-size:10px;font-weight:700;
      padding:3px 10px;border-radius:var(--radius-sm);
      box-shadow:0 0 12px rgba(139,92,246,0.2);
    }

    .back-live-btn{
      position:absolute;top:12px;right:12px;
      background:linear-gradient(135deg,rgba(239,68,68,0.9),rgba(220,38,38,0.9));
      color:#fff;border:none;
      padding:6px 14px;border-radius:var(--radius-sm);
      font-size:11px;font-weight:700;cursor:pointer;
      z-index:10;font-family:var(--font-body);
      display:none;
      transition:var(--transition);
      box-shadow:0 2px 12px rgba(239,68,68,0.2);
    }
    .back-live-btn:hover{
      background:linear-gradient(135deg,var(--red),var(--red-bright));
      box-shadow:0 4px 16px rgba(239,68,68,0.3);
    }

    .stream-bottom{
      position:absolute;bottom:0;left:0;right:0;
      background:linear-gradient(transparent,rgba(0,0,0,0.85));
      padding:16px 20px 10px;
      display:flex;justify-content:space-between;align-items:flex-end;
      pointer-events:none;z-index:10;
    }
    .stream-now{font-size:12px;color:var(--text-muted)}
    .stream-now strong{color:var(--accent);font-weight:600}

    /* ═══ ANALYTICS PANEL ═══ */
    .analytics-panel{
      background:var(--bg-surface);
      border-top:1px solid var(--border-subtle);
      padding:12px 16px;
      display:flex;gap:20px;align-items:center;
      flex-shrink:0;
    }
    .stat-box{
      display:flex;flex-direction:column;gap:2px;
    }
    .stat-label{
      font-family:var(--font-mono);
      font-size:9px;color:var(--text-dim);
      letter-spacing:1.5px;font-weight:700;
      text-transform:uppercase;
    }
    .stat-value{
      font-family:var(--font-mono);
      font-size:16px;font-weight:700;
      color:var(--accent);
    }
    .stat-value.green{color:var(--green-light)}
    .stat-value.purple{color:var(--purple-light)}
    .stat-value.red{color:var(--red-bright)}

    .sparkline{
      display:flex;align-items:flex-end;gap:2px;
      height:28px;
    }
    .spark-bar{
      width:4px;
      background:var(--accent);
      border-radius:2px 2px 0 0;
      min-height:2px;
      transition:height 0.3s ease;
    }

    /* ═══ SIDEBAR ═══ */
    .sidebar{
      background:var(--bg-surface);
      overflow:hidden;
      display:flex;flex-direction:column;
    }
    .sidebar-scroll{flex:1;overflow-y:auto;min-height:0}

    .sidebar-section{
      padding:14px 16px;
      border-bottom:1px solid var(--border-subtle);
    }
    .sidebar-section h3{
      font-family:var(--font-mono);
      font-size:10px;color:var(--accent);
      margin-bottom:10px;letter-spacing:1.5px;font-weight:700;
      display:flex;align-items:center;gap:6px;
    }

    /* Channel items */
    .channel-item{
      display:flex;align-items:center;gap:10px;
      padding:8px 10px;
      border-radius:var(--radius-sm);
      cursor:pointer;
      transition:var(--transition);
      border:1px solid transparent;
    }
    .channel-item:hover{
      background:rgba(145,70,255,0.06);
      border-color:rgba(145,70,255,0.1);
    }
    .channel-item.active{
      background:rgba(145,70,255,0.1);
      border-color:rgba(145,70,255,0.2);
    }
    .channel-live-dot{
      width:9px;height:9px;border-radius:50%;
      flex-shrink:0;
    }
    .channel-live-dot.online{
      background:var(--red);
      animation:pulse 1.5s infinite;
      box-shadow:0 0 6px rgba(239,68,68,0.4);
    }
    .channel-live-dot.offline{background:var(--text-dim)}
    .channel-info{flex:1;min-width:0}
    .channel-name{font-size:13px;font-weight:600;color:var(--text-primary)}
    .channel-game{
      font-size:10px;color:var(--text-muted);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .channel-viewers{
      font-size:10px;color:var(--red-bright);
      font-family:var(--font-mono);font-weight:600;
    }

    /* VOD items */
    .vod-item{
      display:flex;align-items:center;gap:8px;
      padding:7px 10px;
      border-radius:var(--radius-sm);
      cursor:pointer;
      transition:var(--transition);
      font-size:11px;
      border:1px solid transparent;
    }
    .vod-item:hover{
      background:rgba(139,92,246,0.06);
      border-color:rgba(139,92,246,0.1);
    }
    .vod-item.active{
      background:rgba(139,92,246,0.1);
      border-color:rgba(139,92,246,0.15);
    }
    .vod-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .vod-dot.watched{background:rgba(34,197,94,0.5)}
    .vod-dot.current{background:var(--red);animation:pulse 1.5s infinite;box-shadow:0 0 6px rgba(239,68,68,0.4)}
    .vod-dot.pending{background:var(--text-dim)}
    .vod-title{
      color:var(--text-secondary);flex:1;min-width:0;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .vod-game{font-size:9px;color:var(--text-dim)}

    /* Chat */
    .chat-section{
      flex-shrink:0;height:50vh;
      display:flex;flex-direction:column;
      border-top:2px solid rgba(232,121,75,0.2);
      background:var(--bg-elevated);
    }
    .chat-section h3{
      padding:10px 16px 0;
    }
    #chat-container{
      flex:1;min-height:0;
      display:flex;flex-direction:column;
      padding:0 16px 16px;
    }
    .chat-embed{
      flex:1;min-height:400px;
      border-radius:var(--radius-md);
      overflow:hidden;
      border:1px solid var(--border-subtle);
    }
    .chat-embed iframe{width:100%;height:100%;border:none}

    /* Drag handle */
    .drag-handle{
      height:6px;cursor:row-resize;
      background:rgba(232,121,75,0.1);
      flex-shrink:0;position:relative;
      transition:var(--transition);
    }
    .drag-handle:hover,.drag-handle.active{
      background:rgba(232,121,75,0.3);
    }
    .drag-handle::after{
      content:'';position:absolute;top:50%;left:50%;
      transform:translate(-50%,-50%);
      width:36px;height:2px;
      background:rgba(232,121,75,0.4);
      border-radius:1px;
    }

    .hidden{display:none!important}

    /* ═══ TICKER ═══ */
    .ticker{
      display:flex;align-items:center;
      background:linear-gradient(90deg,var(--accent),var(--accent-bright));
      color:var(--bg-base);
      font-weight:700;font-size:11px;letter-spacing:.5px;
      overflow:hidden;
      box-shadow:0 -2px 12px rgba(232,121,75,0.1);
    }
    .ticker-label{
      background:var(--bg-base);
      color:var(--accent);
      padding:0 14px;
      font-family:var(--font-mono);
      font-size:10px;letter-spacing:2px;
      height:100%;display:flex;align-items:center;
      font-weight:700;
    }
    .ticker-content{
      white-space:nowrap;
      animation:scroll 80s linear infinite;
      padding-left:100%;
    }
    @keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}

    /* Scrollbar */
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{
      background:rgba(232,121,75,0.15);
      border-radius:3px;
    }
    ::-webkit-scrollbar-thumb:hover{background:rgba(232,121,75,0.3)}
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-left">
      <div class="logo">MOM <span>TV</span></div>
      <div class="live-badge" id="live-badge">● LIVE</div>
    </div>
    <div class="header-right">
      <div id="auth-section">
        <button class="login-btn" id="login-btn" onclick="twitchLogin()">🔑 Login with Twitch</button>
      </div>
      <div class="clock" id="clock">--:--:--</div>
    </div>
  </div>

  <div class="main">
    <div class="left-panel">
      <div class="stream-area">
        <iframe id="stream-embed" allowfullscreen allow="autoplay; fullscreen; encrypted-media; picture-in-picture"></iframe>
        <div class="stream-overlay">
          <div class="overlay-badge overlay-studio" id="overlay-studio">MOM TV</div>
          <div class="overlay-badge overlay-cast" id="overlay-cast">Loading...</div>
          <div class="vod-badge" id="vod-badge" style="display:none">VOD</div>
        </div>
        <button class="back-live-btn" id="back-live-btn" onclick="switchToLive()">← Back to LIVE</button>
        <div class="stream-bottom">
          <div class="stream-now" id="stream-now"><strong>KNIG04Ei</strong> — Loading...</div>
        </div>
      </div>
      <div class="analytics-panel">
        <div class="stat-box">
          <div class="stat-label">VIEWERS</div>
          <div class="stat-value" id="viewer-count">—</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">SPARKLINE</div>
          <div class="sparkline" id="sparkline"></div>
        </div>
        <div class="stat-box">
          <div class="stat-label">UPTIME</div>
          <div class="stat-value green" id="uptime">—</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">CHAT MSGS</div>
          <div class="stat-value purple" id="chat-count">0</div>
        </div>
      </div>
    </div>

    <div class="sidebar">
      <div class="sidebar-scroll">
        <!-- FOLLOWED CHANNELS -->
        <div class="sidebar-section hidden" id="followed-section">
          <h3>🔴 LIVE FOLLOWED</h3>
          <div id="live-followed"></div>
          <h3 style="margin-top:12px">📺 FOLLOWED CHANNELS</h3>
          <div id="all-followed"></div>
        </div>

        <!-- VOD QUEUE -->
        <div class="sidebar-section">
          <h3>📼 VODS <span id="vod-channel-label" style="color:var(--text-dim)"></span></h3>
          <div id="vod-queue"></div>
        </div>
      </div>

      <div class="drag-handle" id="sidebar-drag"></div>
      <div class="sidebar-section chat-section" id="chat-section">
        <h3>💬 CHAT</h3>
        <div id="chat-container"></div>
      </div>
    </div>
  </div>

  <div class="ticker">
    <div class="ticker-label">MOM TV</div>
    <div class="ticker-content" id="ticker-text">MOMENTUM TV — Live Stream Viewer — gagarin.fameshire.com</div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// MOM TV — Simplified Stream Viewer
// ═══════════════════════════════════════════════════════════════

const GQL_CLIENT_ID = "kimne78kx3ncx6brgo4mv6wki5h1ko";
const OAUTH_CLIENT_ID = localStorage.getItem("momtv_custom_client_id") || "";
function getAuthClientId() { return OAUTH_CLIENT_ID || GQL_CLIENT_ID; }
const DEFAULT_CHANNEL = "KNIG04Ei";
const REDIRECT_URI = window.location.origin + window.location.pathname;
const SCOPES = "user:read:follows chat:read chat:edit";
const TOKEN_KEY = "momtv_twitch_token";
const WATCHED_KEY = "momtv_watched_vods";

let twitchToken = null;
let twitchUser = null;
let currentChannel = DEFAULT_CHANNEL;
let currentVodId = null;
let isLive = false;
let ircWs = null;
let watchedVods = new Set(JSON.parse(localStorage.getItem(WATCHED_KEY) || "[]"));

// ═══ ANALYTICS ═══

let viewerHistory = [];
let streamStartTime = null;
let chatMessageCount = 0;
const MAX_SPARKLINE = 12;

function updateViewerCount(count) {
  if (!count && count !== 0) return;
  document.getElementById("viewer-count").textContent = count.toLocaleString();
  viewerHistory.push(count);
  if (viewerHistory.length > MAX_SPARKLINE) viewerHistory.shift();
  renderSparkline();
}

function renderSparkline() {
  const el = document.getElementById("sparkline");
  if (viewerHistory.length === 0) { el.innerHTML = ''; return; }
  const max = Math.max(...viewerHistory, 1);
  el.innerHTML = viewerHistory.map(v => {
    const h = Math.max(2, Math.round((v / max) * 28));
    return `<div class="spark-bar" style="height:${h}px"></div>`;
  }).join("");
}

function updateUptime() {
  if (!streamStartTime) { document.getElementById("uptime").textContent = "—"; return; }
  const diff = Math.floor((Date.now() - streamStartTime) / 1000);
  const h = Math.floor(diff / 3600);
  const m = Math.floor((diff % 3600) / 60);
  const s = diff % 60;
  document.getElementById("uptime").textContent =
    h > 0 ? `${h}h ${m}m` : `${m}m ${s}s`;
}

function incrementChatCount() {
  chatMessageCount++;
  document.getElementById("chat-count").textContent = chatMessageCount.toLocaleString();
}

// ═══ TWITCH AUTH ═══

function twitchLogin() {
  let cid = OAUTH_CLIENT_ID;
  if (!cid) {
    cid = prompt(
      "Twitch OAuth requires a registered Client ID.\n\n" +
      "1. Go to https://dev.twitch.tv/console/apps\n" +
      "2. Create an application (name: MOM TV)\n" +
      "3. Set OAuth Redirect URL to: " + REDIRECT_URI + "\n" +
      "4. Copy the Client ID and paste it here:\n\n" +
      "(It will be saved in your browser for next time)"
    );
    if (!cid) return;
    localStorage.setItem("momtv_custom_client_id", cid.trim());
  }
  const state = Math.random().toString(36).slice(2);
  sessionStorage.setItem("twitch_oauth_state", state);
  const url = `https://id.twitch.tv/oauth2/authorize?client_id=${cid.trim()}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${encodeURIComponent(SCOPES)}&state=${state}`;
  window.location.href = url;
}

function twitchLogout() {
  twitchToken = null; twitchUser = null;
  localStorage.removeItem(TOKEN_KEY);
  updateAuthUI();
  disconnectIRC();
  document.getElementById("followed-section").classList.add("hidden");
}

function checkOAuthRedirect() {
  const hash = window.location.hash;
  if (!hash.includes("access_token")) return false;
  const params = new URLSearchParams(hash.substring(1));
  const token = params.get("access_token");
  const state = params.get("state");
  if (state !== sessionStorage.getItem("twitch_oauth_state")) return false;
  if (token) {
    twitchToken = token;
    localStorage.setItem(TOKEN_KEY, token);
    window.history.replaceState(null, "", window.location.pathname);
    return true;
  }
  return false;
}

async function validateToken() {
  if (!twitchToken) return false;
  const cid = getAuthClientId();
  try {
    const res = await fetch("https://api.twitch.tv/helix/users", {
      headers: { "Authorization": `Bearer ${twitchToken}`, "Client-Id": cid }
    });
    if (!res.ok) { twitchLogout(); return false; }
    const data = await res.json();
    if (data.data && data.data.length > 0) {
      twitchUser = { id: data.data[0].id, login: data.data[0].login };
      return true;
    }
    twitchLogout();
    return false;
  } catch { twitchLogout(); return false; }
}

function updateAuthUI() {
  const section = document.getElementById("auth-section");
  if (twitchUser) {
    section.innerHTML = `<div class="user-info">
      <img class="user-avatar" src="https://static-cdn.jtvnw.net/jtv_user_pictures/${twitchUser.login}-profile_image-70x70.png" onerror="this.style.display='none'" alt="">
      <span class="user-name">${twitchUser.login}</span>
      <button class="logout-btn" onclick="twitchLogout()">✕</button>
    </div>`;
  } else {
    section.innerHTML = `<button class="login-btn" id="login-btn" onclick="twitchLogin()">🔑 Login with Twitch</button>`;
  }
}

// ═══ TWITCH API ═══

async function helixGet(endpoint) {
  const headers = { "Client-Id": getAuthClientId() };
  if (twitchToken) headers["Authorization"] = `Bearer ${twitchToken}`;
  const res = await fetch(`https://api.twitch.tv/helix/${endpoint}`, { headers });
  if (!res.ok) throw new Error(`Twitch API ${res.status}`);
  return (await res.json()).data;
}

async function gqlQuery(query, variables) {
  const headers = { "Client-Id": GQL_CLIENT_ID, "Content-Type": "application/json" };
  const res = await fetch("https://gql.twitch.tv/gql", {
    method: "POST", headers, body: JSON.stringify({ query, variables })
  });
  return (await res.json()).data;
}

async function fetchFollowedChannels() {
  if (!twitchUser) return [];
  try {
    const data = await helixGet(`channels/followed?user_id=${twitchUser.id}&first=100`);
    return data || [];
  } catch (e) { console.warn("Followed fetch failed:", e); return []; }
}

async function fetchLiveFollowed() {
  if (!twitchUser) return [];
  try {
    const data = await helixGet(`streams/followed?user_id=${twitchUser.id}&first=100`);
    return (data || []).filter(s => s.type === "live");
  } catch (e) { console.warn("Live followed fetch failed:", e); return []; }
}

async function fetchVods(channel) {
  try {
    const data = await gqlQuery(
      `query($login:String!){user(login:$login){videos(first:20,type:ARCHIVE,sort:TIME){edges{node{id title game{displayName} createdAt lengthSeconds}}}}}`,
      { login: channel }
    );
    const edges = data?.user?.videos?.edges || [];
    return edges.map(e => ({
      id: e.node.id, title: e.node.title, game: e.node.game?.displayName || "",
      createdAt: e.node.createdAt, length: e.node.lengthSeconds
    }));
  } catch (e) { console.warn("VOD fetch failed:", e); return []; }
}

async function fetchStreamStatus(channel) {
  try {
    const data = await gqlQuery(
      `query($login:String!){user(login:$login){stream{type viewersCount game{displayName} title}videos(first:5,type:ARCHIVE,sort:TIME){edges{node{id title game{displayName}}}}}}`,
      { login: channel }
    );
    return data?.user;
  } catch (e) { console.warn("Stream status failed:", e); return null; }
}

// ═══ IRC CHAT ═══

function connectIRC(channel) {
  disconnectIRC();
  if (!twitchToken) return;
  try {
    ircWs = new WebSocket("wss://irc-ws.chat.twitch.tv:443");
    ircWs.onopen = () => {
      ircWs.send(`PASS oauth:${twitchToken}`);
      ircWs.send(`NICK ${twitchUser?.login || "justinfan12345"}`);
      ircWs.send(`JOIN #${channel}`);
    };
    ircWs.onmessage = (e) => {
      const lines = e.data.split("\r\n");
      for (const line of lines) {
        if (line.includes("PRIVMSG")) {
          const match = line.match(/:(\w+)!\w+@\w+\.tmi\.twitch\.tv PRIVMSG #\w+ :(.+)/);
          if (match) { incrementChatCount(); }
        }
        if (line.startsWith("PING")) ircWs.send("PONG :tmi.twitch.tv");
      }
    };
    ircWs.onclose = () => {};
    ircWs.onerror = () => {};
  } catch {}
}

function disconnectIRC() {
  if (ircWs) { ircWs.close(); ircWs = null; }
}

function renderChatEmbed(channel) {
  const el = document.getElementById("chat-container");
  const parents = getParents();
  const pp = parents.map(p => `&parent=${p}`).join("");
  el.innerHTML = `<div class="chat-embed"><iframe src="https://www.twitch.tv/embed/${channel}/chat?parent=${parents[0]}${pp}" frameborder="0"></iframe></div>`;
}

// ═══ STREAM EMBED ═══

function getParents() {
  const h = window.location.hostname;
  if (h === "localhost" || h === "127.0.0.1") return ["localhost", "127.0.0.1"];
  return [h];
}

function embedStream(channel) {
  channel = channel || currentChannel;
  currentChannel = channel;
  const pp = getParents().map(p => `&parent=${p}`).join("");
  document.getElementById("stream-embed").src = `https://player.twitch.tv/?channel=${channel}${pp}&autoplay=true&muted=true`;
  document.getElementById("vod-badge").style.display = "none";
  document.getElementById("back-live-btn").style.display = "none";
  document.getElementById("live-badge").textContent = "● LIVE";
  document.getElementById("live-badge").style.background = "linear-gradient(135deg,#ef4444,#ff5757)";
  isLive = true; currentVodId = null;
  streamStartTime = Date.now();
  renderChatEmbed(channel);
  document.getElementById("overlay-cast").textContent = channel;
}

function embedVod(vodId, title, channel) {
  channel = channel || currentChannel;
  const pp = getParents().map(p => `&parent=${p}`).join("");
  if (currentVodId) markWatched(currentVodId);
  document.getElementById("stream-embed").src = `https://player.twitch.tv/?video=${vodId}${pp}&autoplay=true&muted=true`;
  document.getElementById("vod-badge").style.display = "inline";
  document.getElementById("back-live-btn").style.display = "block";
  document.getElementById("live-badge").textContent = "● VOD";
  document.getElementById("live-badge").style.background = "linear-gradient(135deg,#9146ff,#7c3aed)";
  isLive = false; currentVodId = vodId;
  streamStartTime = null;
  document.getElementById("stream-now").innerHTML = `<strong>VOD:</strong> ${title || vodId}`;
  renderChatEmbed(channel);
  renderVodQueue();
}

function switchToLive() {
  embedStream(currentChannel);
  loadVods(currentChannel);
}

function switchToChannel(channel) {
  currentChannel = channel;
  embedStream(channel);
  loadVods(channel);
}

// ═══ VOD TRACKING ═══

function markWatched(vodId) {
  watchedVods.add(vodId);
  localStorage.setItem(WATCHED_KEY, JSON.stringify([...watchedVods]));
}

function getUnwatchedVods(vods) { return vods.filter(v => !watchedVods.has(v.id)); }

let allVods = [];
async function loadVods(channel) {
  allVods = await fetchVods(channel);
  document.getElementById("vod-channel-label").textContent = `(${channel})`;
  renderVodQueue();
}

function renderVodQueue() {
  const el = document.getElementById("vod-queue");
  if (allVods.length === 0) { el.innerHTML = '<div style="font-size:10px;color:var(--text-dim);padding:4px">No VODs found</div>'; return; }
  el.innerHTML = allVods.slice(0, 10).map(v => {
    const status = v.id === currentVodId ? "current" : watchedVods.has(v.id) ? "watched" : "pending";
    return `<div class="vod-item${v.id === currentVodId ? ' active' : ''}" onclick="embedVod('${v.id}','${escapeHtml(v.title).replace(/'/g,"\\'")}','${currentChannel}')">
      <div class="vod-dot ${status}"></div>
      <div style="flex:1;min-width:0">
        <div class="vod-title" title="${escapeHtml(v.title)}">${v.title.slice(0,40)}${v.title.length>40?"...":""}</div>
        <div class="vod-game">${v.game || "Unknown"}</div>
      </div>
    </div>`;
  }).join("");
}

// ═══ FOLLOWED CHANNELS ═══

async function loadFollowedChannels() {
  if (!twitchUser) return;
  const [live, followed] = await Promise.all([fetchLiveFollowed(), fetchFollowedChannels()]);
  const section = document.getElementById("followed-section");
  section.classList.remove("hidden");

  const liveEl = document.getElementById("live-followed");
  if (live.length === 0) {
    liveEl.innerHTML = '<div style="font-size:10px;color:var(--text-dim);padding:4px">No followed channels live</div>';
  } else {
    liveEl.innerHTML = live.map(s => {
      const active = s.user_login === currentChannel ? " active" : "";
      return `<div class="channel-item${active}" onclick="switchToChannel('${s.user_login}')">
        <div class="channel-live-dot online"></div>
        <div class="channel-info">
          <div class="channel-name">${s.user_name}</div>
          <div class="channel-game">${s.game_name || "Just Chatting"} — ${escapeHtml(s.title||"").slice(0,30)}</div>
        </div>
        <div class="channel-viewers">${(s.viewer_count||0).toLocaleString()}</div>
      </div>`;
    }).join("");
  }

  const offline = followed.filter(f => !live.some(l => l.user_login === f.broadcaster_login));
  const allEl = document.getElementById("all-followed");
  if (offline.length === 0) {
    allEl.innerHTML = '<div style="font-size:10px;color:var(--text-dim);padding:4px">All followed are live!</div>';
  } else {
    allEl.innerHTML = offline.slice(0, 15).map(f => {
      return `<div class="channel-item" onclick="switchToChannel('${f.broadcaster_login}')">
        <div class="channel-live-dot offline"></div>
        <div class="channel-info">
          <div class="channel-name">${f.broadcaster_name}</div>
          <div class="channel-game">${f.game_name || "Offline"}</div>
        </div>
      </div>`;
    }).join("");
  }
}

function escapeHtml(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

// ═══ STREAM STATUS LOOP ═══

async function checkStream() {
  const user = await fetchStreamStatus(currentChannel);
  if (!user) return;
  const live = user.stream?.type === "live";
  if (live && !isLive) {
    embedStream(currentChannel);
    updateViewerCount(user.stream?.viewersCount || 0);
    document.getElementById("stream-now").innerHTML = `<strong>${currentChannel}</strong> — ${user.stream.game?.displayName||""} — ${(user.stream.viewersCount||0).toLocaleString()} viewers`;
  } else if (!live && isLive) {
    await loadVods(currentChannel);
    if (allVods.length > 0) {
      const unwatched = getUnwatchedVods(allVods);
      const next = unwatched[0] || allVods[0];
      if (next) embedVod(next.id, next.title, currentChannel);
    }
  } else if (live) {
    updateViewerCount(user.stream?.viewersCount || 0);
    document.getElementById("stream-now").innerHTML = `<strong>${currentChannel}</strong> — ${user.stream.game?.displayName||""} — ${(user.stream.viewersCount||0).toLocaleString()} viewers`;
  }
}

function updateClock() { document.getElementById("clock").textContent = new Date().toLocaleTimeString("en-US",{hour12:false}); }

// ═══ SETTINGS ═══
const SETTINGS_KEY = "momtv_settings";
const DEFAULT_SETTINGS = { chatHeightVh: 50, sidebarWidth: 400, channel: DEFAULT_CHANNEL };
let settings = { ...DEFAULT_SETTINGS };

function loadSettings() {
  try {
    const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
    settings = { ...DEFAULT_SETTINGS, ...saved };
  } catch { settings = { ...DEFAULT_SETTINGS }; }
  applySettings();
}

function saveSettings() {
  settings.channel = currentChannel;
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
}

function applySettings() {
  const chatSection = document.getElementById("chat-section");
  if (chatSection) chatSection.style.height = `${settings.chatHeightVh}vh`;
  const main = document.querySelector(".main");
  if (main) main.style.gridTemplateColumns = `1fr ${settings.sidebarWidth}px`;
}

// ═══ DRAG HANDLE ═══
function initDragHandle() {
  const handle = document.getElementById("sidebar-drag");
  const chatSection = document.getElementById("chat-section");
  const sidebar = document.querySelector(".sidebar");
  if (!handle || !chatSection || !sidebar) return;

  let startY = 0, startHeight = 0, sidebarH = 0;

  handle.addEventListener("mousedown", (e) => {
    e.preventDefault();
    handle.classList.add("active");
    startY = e.clientY;
    startHeight = chatSection.offsetHeight;
    sidebarH = sidebar.offsetHeight;

    const onMove = (ev) => {
      const delta = startY - ev.clientY;
      const newChatH = Math.max(100, Math.min(sidebarH - 100, startHeight + delta));
      const vh = (newChatH / window.innerHeight) * 100;
      chatSection.style.height = `${vh}vh`;
      settings.chatHeightVh = Math.round(vh);
    };

    const onUp = () => {
      handle.classList.remove("active");
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      saveSettings();
    };

    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
}

// ═══ INIT ═══

(async function init() {
  checkOAuthRedirect();
  if (!twitchToken) twitchToken = localStorage.getItem(TOKEN_KEY);

  if (twitchToken) {
    const valid = await validateToken();
    if (valid) {
      updateAuthUI();
      await loadFollowedChannels();
    }
  }

  loadSettings();
  initDragHandle();

  embedStream(settings.channel || DEFAULT_CHANNEL);
  await loadVods(DEFAULT_CHANNEL);
  updateClock();
  checkStream();

  setInterval(updateClock, 1000);
  setInterval(checkStream, 30000);       // Stream status every 30s
  setInterval(() => { if (twitchUser) loadFollowedChannels(); }, 120000);
  setInterval(updateUptime, 1000);       // Uptime every second
})();
</script>
