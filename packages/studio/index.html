<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>MOMTV Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0a0a1a;
      font-family: 'Noto Sans', 'Inter', sans-serif;
    }

    #studio-container {
      position: relative;
      width: 1920px;
      height: 1080px;
    }

    #pixi-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* Overlay UI Layer */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* Header Bar */
    #header-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: linear-gradient(180deg, rgba(232, 121, 75, 0.95) 0%, rgba(232, 121, 75, 0.7) 100%);
      display: flex;
      align-items: center;
      padding: 0 30px;
      z-index: 20;
    }

    #header-bar .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #header-bar .logo-icon {
      font-size: 28px;
    }

    #header-bar .logo-text {
      font-size: 28px;
      font-weight: 900;
      color: #1a1a2e;
      letter-spacing: 2px;
    }

    #header-bar .live-badge {
      position: absolute;
      right: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1a1a2e;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }

    #header-bar .live-dot {
      width: 10px;
      height: 10px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Breaking News Banner */
    #breaking-banner {
      position: absolute;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
      padding: 12px 40px;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-radius: 4px;
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.5);
      display: none;
      z-index: 25;
    }

    #breaking-banner.visible {
      display: block;
      animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
      from { transform: translateX(-50%) translateY(-20px); opacity: 0; }
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }

    /* Agent Sidebar */
    #agent-sidebar {
      position: absolute;
      top: 80px;
      left: 20px;
      background: rgba(26, 26, 46, 0.9);
      border-radius: 12px;
      padding: 16px;
      width: 180px;
      z-index: 20;
    }

    #agent-sidebar .sidebar-title {
      font-size: 14px;
      font-weight: 700;
      color: #e8794b;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #agent-sidebar .agent-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      color: #fff;
      font-size: 13px;
    }

    #agent-sidebar .agent-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    #agent-sidebar .agent-role {
      color: #888;
      font-size: 11px;
    }

    /* Speech Bubble */
    .speech-bubble {
      position: absolute;
      background: #fff;
      border-radius: 16px;
      padding: 16px 20px;
      max-width: 400px;
      font-size: 18px;
      line-height: 1.5;
      color: #1a1a2e;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      display: none;
      z-index: 15;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 30px;
      border-width: 12px 10px 0;
      border-style: solid;
      border-color: #fff transparent transparent;
    }

    .speech-bubble.visible {
      display: block;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Bottom Ticker */
    #ticker-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: linear-gradient(90deg, rgba(26, 26, 46, 0.95), rgba(26, 26, 46, 0.8));
      border-top: 3px solid #e8794b;
      display: flex;
      align-items: center;
      padding: 0 20px;
      z-index: 20;
      overflow: hidden;
    }

    #ticker-content {
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      animation: ticker-scroll 30s linear infinite;
    }

    @keyframes ticker-scroll {
      from { transform: translateX(100%); }
      to { transform: translateX(-100%); }
    }

    /* Agent Name Plates */
    .name-plate {
      position: absolute;
      background: linear-gradient(180deg, rgba(26, 26, 46, 0.9), rgba(26, 26, 46, 0.7));
      color: #fff;
      padding: 8px 20px;
      text-align: center;
      border-radius: 4px;
      z-index: 15;
    }

    .name-plate .agent-name {
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .name-plate .agent-role {
      font-size: 12px;
      color: #e8794b;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Connection Status */
    #connection-status {
      position: absolute;
      top: 80px;
      right: 20px;
      background: rgba(26, 26, 46, 0.9);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      color: #888;
      z-index: 20;
    }

    #connection-status.connected {
      color: #22c55e;
    }

    #connection-status.disconnected {
      color: #ef4444;
    }
  </style>
</head>
<body>
  <div id="studio-container">
    <!-- PixiJS Canvas (rendered here) -->
    <canvas id="pixi-canvas"></canvas>

    <!-- UI Overlay Layer -->
    <div id="ui-layer">
      <!-- Header Bar -->
      <div id="header-bar">
        <div class="logo">
          <span class="logo-icon">📺</span>
          <span class="logo-text">MOMTV STUDIO</span>
        </div>
        <div class="live-badge">
          <div class="live-dot"></div>
          <span>LIVE</span>
          <span id="agent-count">2 AGENTS</span>
        </div>
      </div>

      <!-- Breaking News Banner -->
      <div id="breaking-banner">BREAKING NEWS</div>

      <!-- Agent Sidebar -->
      <div id="agent-sidebar">
        <div class="sidebar-title">
          <span>🤖</span> AGENTS
        </div>
        <div id="agent-list"></div>
      </div>

      <!-- Speech Bubbles (positioned dynamically) -->
      <div id="speech-bubble-alex" class="speech-bubble" style="left: 200px; top: 300px;"></div>
      <div id="speech-bubble-sasha" class="speech-bubble" style="left: 900px; top: 300px;"></div>

      <!-- Name Plates -->
      <div id="nameplate-alex" class="name-plate" style="left: 280px; bottom: 100px;">
        <div class="agent-name">ALEX</div>
        <div class="agent-role">ANCHOR</div>
      </div>
      <div id="nameplate-sasha" class="name-plate" style="left: 880px; bottom: 100px;">
        <div class="agent-name">SASHA</div>
        <div class="agent-role">ANALYST</div>
      </div>

      <!-- Bottom Ticker -->
      <div id="ticker-bar">
        <div id="ticker-content">Welcome to MOMTV Studio! AI-powered cartoon TV commentary...</div>
      </div>

      <!-- Connection Status -->
      <div id="connection-status" class="disconnected">⚡ Connecting...</div>

      <!-- Twitch Login Button -->
      <div id="twitch-login" style="position: absolute; top: 80px; right: 20px; z-index: 20;">
        <button id="twitch-login-btn" style="
          background: #9146FF;
          color: white;
          border: none;
          padding: 10px 20px;
          border-radius: 8px;
          font-size: 14px;
          font-weight: 600;
          cursor: pointer;
          font-family: 'Noto Sans', sans-serif;
          pointer-events: all;
        ">🎮 Login with Twitch</button>
        <div id="twitch-user" style="display: none; color: #fff; font-size: 13px; margin-top: 8px; text-align: center;"></div>
      </div>

      <!-- Channel Selector -->
      <div id="channel-selector" style="
        position: absolute;
        top: 140px;
        right: 20px;
        background: rgba(26, 26, 46, 0.9);
        border-radius: 12px;
        padding: 16px;
        width: 200px;
        z-index: 20;
        display: none;
      ">
        <div style="font-size: 14px; font-weight: 700; color: #e8794b; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px;">
          📺 Channels
        </div>
        <div id="channel-list"></div>
        <input id="channel-input" type="text" placeholder="Add channel..." style="
          width: 100%;
          padding: 8px;
          margin-top: 8px;
          border-radius: 6px;
          border: 1px solid #444;
          background: #1a1a2e;
          color: #fff;
          font-size: 13px;
          font-family: 'Noto Sans', sans-serif;
          pointer-events: all;
        " />
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
