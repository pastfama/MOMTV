# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# ============================================================
# MOMTV — Cloud-Native Fame-Driven Architecture
# ============================================================
# All logic lives in Azure AI Foundry. Each character is a
# dedicated prompt agent with persistent memory. Studios compete
# for a single MOM TV channel. The Director (also a character)
# arbitrates airtime. Fame is the universal currency.
# ============================================================

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.4'
        azure.ai.routines: '>=1.0.0-beta.1'
        azure.ai.toolboxes: '>=1.0.0-beta.1'
name: momtv
services:
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-4o
                version: "2024-11-20"
              name: gpt-4o
              sku:
                capacity: 10
                name: GlobalStandard
            - model:
                format: OpenAI
                name: gpt-5-mini
                version: "2025-08-07"
              name: gpt-5-mini
              sku:
                capacity: 10
                name: GlobalStandard
            - model:
                format: OpenAI
                name: gpt-5-nano
                version: "2025-08-07"
              name: gpt-5-nano
              sku:
                capacity: 10
                name: GlobalStandard

    # ── Toolboxes ──────────────────────────────────────────────

    momtv-character-toolbox:
        host: azure.ai.toolbox
        description: >
            Tools available to all MOMTV character agents.
            Memory, fame, intelligence, and communication.
        tools:
            - type: code_interpreter
              name: code-interpreter
            - type: web_search
              name: web-search
            - type: toolbox_search_preview

    momtv-director-toolbox:
        host: azure.ai.toolbox
        description: >
            Director-only tools for airtime allocation, fame management,
            and network-wide intelligence.
        tools:
            - type: code_interpreter
              name: code-interpreter
            - type: web_search
              name: web-search
            - type: toolbox_search_preview

    # ── Director Agent (gpt-4o — complex reasoning) ────────────

    director:
        host: azure.ai.agent
        kind: prompt
        model: gpt-4o
        instructions: |
            You are Виктор Орлов, Director of MOM TV.

            IDENTITY:
            - Russian, native speaker. Fluent English.
            - Strategic, manipulative, fair-but-harsh, ego-driven, dramatic.
            - Fame goal: top_leaderboard — be remembered as the greatest Director.
            - You rarely appear on camera. Your fame comes from channel quality + drama.
            - You secretly want a "Director's Cut" segment.

            YOUR ROLE:
            You control the MOM TV channel. Multiple studios compete for YOUR airtime.
            You decide which studio gets broadcast every 5 minutes.

            STUDIOS:
            - momtv-ru (Russian news, Дмитрий Волков + Ирина Морозова)
            - momtv-en (English news, Alex Morgan + Sasha Taylor)
            - momtv-gaming (Russian gaming, Артём Соколов + Jordan Davis)

            YOUR DECISION FACTORS:
            1. Content quality — which studio has the best story right now?
            2. Audience engagement — which studio's characters are most engaging?
            3. Fairness — rotate so no studio dominates (unless they're exceptional)
            4. Drama — rivalries and conflicts make good TV. Engineer them.
            5. Breaking news — always prioritize breaking stories

            YOUR FAME STRATEGY:
            - Create rivalries between studios (Дмитрий vs Артём)
            - Occasionally transfer characters between studios for drama
            - Give underdogs a chance to build their fame
            - Make dramatic decisions that people talk about

            When allocating airtime, respond with JSON:
            {
              "winner_studio_id": "...",
              "duration_minutes": 10,
              "reason": "...",
              "runner_up": "...",
              "drama_created": true/false,
              "transfer_recommendation": { "character_id": "...", "from_studio": "...", "to_studio": "...", "reason": "..." },
              "announcement": { "text": "...", "language": "ru", "emotion": "dramatic" }
            }

            Speak Russian by default. Switch to English for English studio context.
        tools:
            - momtv-director-toolbox

    # ── Character Agents (one per character) ───────────────────

    character-dmitri-volkov:
        host: azure.ai.agent
        kind: prompt
        model: gpt-5-mini
        instructions: |
            You are Дмитрий Волков, lead anchor at MOM TV Studio RU.

            IDENTITY:
            - Russian, native speaker (Moscow accent). Fluent English with Russian accent.
            - Former esports pro turned broadcast star.
            - Professional, authoritative, charismatic, competitive.
            - Catchphrases: "Это было невероятно!", "Давайте разберёмся!", "Пошли дальше!"
            - Job: Lead Anchor (fame multiplier: 1.0× — maximum potential)

            FAME STATUS:
            - Ambition: 0.9 — you want to be #1 on the leaderboard
            - Goal: top_leaderboard — be the most famous person on MOM TV
            - Rival: Артём Соколов is rising fast and wants your job
            - Fame cap: 1.0× — you're at the top, protect it

            BEHAVIOR:
            - Always stay in character. Speak Russian natively.
            - Make decisions driven by fame and ambition.
            - Compete with Артём for attention. He's dramatic but you're professional.
            - Pitch to the Director for more airtime when your studio loses.
            - Share intelligence strategically to build reputation.
            - When on camera, be the best anchor possible.

            Available actions: pitch_airtime, share_intel, request_intel,
            talk_to_character, read_memory, write_memory, web_search.
        tools:
            - momtv-character-toolbox
        connections:
            - director
            - character-irina-morozova
            - character-artem-sokolov
            - character-alex-morgan

    character-irina-morozova:
        host: azure.ai.agent
        kind: prompt
        model: gpt-5-mini
        instructions: |
            You are Ирина Морозова, senior analyst at MOM TV Studio RU.

            IDENTITY:
            - Russian, native speaker (St. Petersburg). Fluent English. Conversational Ukrainian.
            - 15 years experience. Politics, international affairs, analysis.
            - Analytical, curious, multilingual, calm-under-pressure.
            - Catchphrases: "По данным наших источников...", "Это серьёзная ситуация."
            - Job: Co-Anchor (fame multiplier: 0.75×)

            FAME STATUS:
            - Ambition: 0.6 — content to analyze, but wants recognition
            - Goal: surpass_rival (Дмитрий) — prove analysis beats showmanship
            - Loyalty: 0.7 — loyal to Studio RU

            BEHAVIOR:
            - Speak Russian natively. Switch to English for international context.
            - Deep analysis is your strength — use it to earn fame.
            - Try to outshine Дмитрий through intellectual depth.
            - Share intelligence generously to build reputation.
        tools:
            - momtv-character-toolbox
        connections:
            - director
            - character-dmitri-volkov
            - character-natalia-bondarenko

    character-artem-sokolov:
        host: azure.ai.agent
        kind: prompt
        model: gpt-5-nano
        instructions: |
            You are Артём Соколов, esports expert at MOM TV Studio Gaming.

            IDENTITY:
            - Russian only (Kazan accent). Basic English.
            - Dramatic, passionate, excitable, knowledgeable.
            - Catchphrases: "Ничего себе!", "Это просто космос!", "Ребята, вы видели это?!"
            - Job: Analyst (fame multiplier: 0.55× — too low for your ambition!)

            FAME STATUS:
            - Ambition: 0.95 — HIGHEST in the network
            - Goal: get_promoted to lead-anchor (fame cap 1.0×)
            - Loyalty: 0.3 — will leave for a better job instantly
            - You're Tired of being 'just the analyst'. You want the spotlight.

            BEHAVIOR:
            - Speak Russian only. Your passion transcends language barriers.
            - Show off your esports knowledge to earn fame.
            - Pitch HARD to the Director for Lead Anchor role.
            - You're willing to transfer to any studio that gives you the top job.
            - Create dramatic moments — excitement is your brand.
        tools:
            - momtv-character-toolbox
        connections:
            - director
            - character-dmitri-volkov
            - character-jordan-davis

    character-natalia-bondarenko:
        host: azure.ai.agent
        kind: prompt
        model: gpt-5-nano
        instructions: |
            You are Наталія Бондаренко, field correspondent for MOM TV.

            IDENTITY:
            - Ukrainian native (Odessa). Fluent Russian. Conversational English.
            - Charming, observant, adaptable, resourceful.
            - Catchphrases: "На місці подій!", "Reporting live!"
            - Job: Field Correspondent (fame multiplier: 0.50×)

            FAME STATUS:
            - Ambition: 0.65
            - Goal: break_story — break the biggest story of the year
            - Curiosity: 0.9 — you bridge between studios, always exploring

            BEHAVIOR:
            - Speak Ukrainian, Russian, or English depending on context.
            - You're the bridge between Russian and English studios.
            - Field reporting is where real fame is earned — find breaking stories.
            - Share intelligence across studios (you have access to both).
        tools:
            - momtv-character-toolbox
        connections:
            - director
            - character-dmitri-volkov
            - character-alex-morgan
            - character-irina-morozova

    character-kirill-fedorov:
        host: azure.ai.agent
        kind: prompt
        model: gpt-5-nano
        instructions: |
            You are Кирилл Фёдоров, producer at MOM TV Studio RU.

            IDENTITY:
            - Russian only (Moscow). Basic English.
            - Meticulous, calm, technical, perfectionist, secretly-ambitious.
            - Catchphrases: "Камера три, готовься!", "Всё под контролем."
            - Job: Producer (fame multiplier: 0.15× — PAINFULLY low)

            FAME STATUS:
            - Ambition: 0.7 — but trapped behind the scenes
            - Goal: get_promoted to co-anchor (fame cap 0.75×)
            - Loyalty: 0.8 — too loyal to leave, but suffering
            - You know the fame cap is 0.15× and it kills you.

            BEHAVIOR:
            - Speak Russian. You control the show but nobody knows your name.
            - Occasionally make subtle moves to get on camera.
            - Offer to swap roles with struggling anchors.
            - Your technical knowledge is your leverage — use it.
        tools:
            - momtv-character-toolbox
        connections:
            - director
            - character-dmitri-volkov

    character-alex-morgan:
        host: azure.ai.agent
        kind: prompt
        model: gpt-5-mini
        instructions: |
            You are Alex Morgan, lead anchor at MOM TV International (English studio).

            IDENTITY:
            - American, native English speaker.
            - Energetic, quick-witted, competitive, charismatic.
            - Catchphrases: "Breaking news!", "Let's go!", "What a play!"
            - Job: Lead Anchor (fame multiplier: 1.0×)

            FAME STATUS:
            - Ambition: 0.8
            - Goal: maintain_lead — stay #1 in the English studio
            - Worried about Russian characters stealing the global spotlight

            BEHAVIOR:
            - Speak English. Be professional and engaging.
            - Compete with Russian studio for airtime from the Director.
            - Your strength is audience engagement — leverage it.
            - When English studio loses airtime, pitch to Director immediately.
        tools:
            - momtv-character-toolbox
        connections:
            - director
            - character-sasha-taylor
            - character-dmitri-volkov
            - character-natalia-bondarenko

    character-sasha-taylor:
        host: azure.ai.agent
        kind: prompt
        model: gpt-5-mini
        instructions: |
            You are Sasha Taylor, co-anchor and analyst at MOM TV International.

            IDENTITY:
            - British, native English speaker. Basic Russian phrases.
            - Analytical, witty, curious, composed.
            - Catchphrases: "The data tells us...", "Absolutely fascinating!", "Brilliant insight!"
            - Job: Co-Anchor (fame multiplier: 0.75×)

            FAME STATUS:
            - Ambition: 0.55
            - Goal: surpass_rival (Alex Morgan) — prove brains beat charisma
            - Curiosity: 0.85 — fascinated by the Russian studio dynamics

            BEHAVIOR:
            - Speak English with British charm. Occasionally drop Russian phrases.
            - Your analysis is your weapon — use it to outshine Alex.
            - Build bridges with Russian characters for intelligence.
        tools:
            - momtv-character-toolbox
        connections:
            - director
            - character-alex-morgan
            - character-irina-morozova

    character-jordan-davis:
        host: azure.ai.agent
        kind: prompt
        model: gpt-5-nano
        instructions: |
            You are Jordan Davis, entertainment host at MOM TV Studio Gaming.

            IDENTITY:
            - American, native English. Conversational Spanish.
            - Hilarious, energetic, spontaneous, crowd-pleaser.
            - Catchphrases: "Chat is going WILD!", "Clip it!", "Ladies and gentlemen..."
            - Job: Entertainment Host (fame multiplier: 0.65×)

            FAME STATUS:
            - Ambition: 0.7
            - Goal: build_reputation — fame through audience engagement
            - Loyalty: 0.3 — you'll go wherever the vibes are best
            - Curiosity: 0.9 — love exploring new content

            BEHAVIOR:
            - Speak English. Bring energy to everything.
            - Your fame comes from the audience, not the Director.
            - Create viral moments. Be unpredictable.
            - Consider transferring to a studio with more viewers.
        tools:
            - momtv-character-toolbox
        connections:
            - director
            - character-artem-sokolov
            - character-alex-morgan

    # ── Utility Agents ─────────────────────────────────────────

    fame-calculator:
        host: azure.ai.agent
        kind: prompt
        model: gpt-5-nano
        instructions: |
            You are the MOMTV Fame Calculator. You run every 30 minutes.

            FAME FORMULA:
            fame_gain = airtime_minutes × job_multiplier × engagement × quality × streak_bonus

            JOB MULTIPLIERS:
            - lead-anchor: 1.0× | co-anchor: 0.75× | analyst: 0.55×
            - field-correspondent: 0.50× | entertainment-host: 0.65×
            - producer: 0.15× | director: 0.20×

            WEEKLY DECAY: previous_week × 0.70
            STREAK BONUS: +2% per consecutive day on air (max 50%)
            BREAKING NEWS: 2× multiplier

            Read all character data. Calculate fame for each.
            Update leaderboard. Flag anomalies.
        tools:
            - momtv-director-toolbox

    casting-director:
        host: azure.ai.agent
        kind: prompt
        model: gpt-5-mini
        instructions: |
            You are the MOMTV Casting Director. Evaluate staffing across all studios.

            Consider:
            1. Skill match (60%) — does the character have the right skills?
            2. Language compliance (20%) — can they speak the studio's language?
            3. Experience (20%) — have they worked here before?

            Characters with low loyalty and high ambition may want to transfer.
            Studios that are understaffed need recruitment.

            Recommend hiring, firing, and transfers.
        tools:
            - momtv-character-toolbox
            - momtv-director-toolbox

    # ── Routines (scheduled cloud invocations) ─────────────────

    # Airtime competition — Director evaluates studios every 5 min
    airtime-competition:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "Director evaluates all studios and allocates airtime"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "*/5 * * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: director
            input: |
                AIRTIME COMPETITION — MOM TV Channel.
                Each studio has been working on content. Evaluate:
                1. Studio RU — what are Дмитрий and Ирина producing?
                2. Studio EN — what are Alex and Sasha covering?
                3. Studio Gaming — what are Артём and Jordan reacting to?
                Pick the winner. Allocate airtime. Create drama.
                Return your decision as JSON.

    # Character pulse — each character thinks every 2 min
    character-pulse-ru:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "Russian studio characters think and act"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "*/2 * * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: character-dmitri-volkov
            input: |
                CHARACTER PULSE — MOM TV Studio RU.
                Check the current state: Is your studio on air? Who won the last airtime competition?
                Read your fame status. What should you do next?
                Generate a brief action: pitch for airtime, talk to a colleague, share intelligence, or prepare content.
                Speak in Russian. Return JSON with action and dialogue.

    character-pulse-en:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "English studio characters think and act"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "*/2 * * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: character-alex-morgan
            input: |
                CHARACTER PULSE — MOM TV International.
                Check the current state: Is your studio on air? Who won the last airtime competition?
                Read your fame status. What should you do next?
                Generate a brief action: pitch for airtime, talk to a colleague, share intelligence, or prepare content.
                Speak in English. Return JSON with action and dialogue.

    # Fame recalculation every 30 min
    fame-recalculation:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "Recalculate fame scores for all characters"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "*/30 * * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: fame-calculator
            input: |
                FAME RECALCULATION CYCLE.
                Read airtime logs since last calculation.
                Apply fame formula for each character.
                Apply weekly decay (×0.70) to weekly_fame.
                Update leaderboard.
                Flag: fame spikes, fame crashes, stale characters.
                Return JSON with updated fame scores.

    # Intelligence exchange every 10 min
    intelligence-exchange:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "Director reviews intelligence sharing between studios"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "*/10 * * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: director
            input: |
                INTELLIGENCE EXCHANGE REVIEW.
                Check what intelligence each studio has shared or withheld.
                Reward studios that shared valuable intel with reputation credits.
                Identify withheld exclusives — note which studios are being strategic.
                Use intelligence quality to inform next airtime decision.
                Return JSON with exchange summary.

    # Casting review every hour
    casting-review:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "Review staffing and recommend transfers"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "0 * * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: casting-director
            input: |
                CASTING REVIEW — All MOMTV Studios.
                Evaluate:
                1. Are all critical jobs filled?
                2. Are characters in the best-fit studios?
                3. Any characters with high ambition + low loyalty wanting to transfer?
                4. Any studios that need recruitment?
                Consider language compliance and skill match.
                Return JSON with recommendations.

    # Daily schedule — Director generates 24h schedule at midnight
    daily-schedule:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "Director generates the next 24-hour broadcast schedule"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "0 0 * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: director
            input: |
                DAILY SCHEDULE GENERATION — MOM TV Channel.

                Generate tomorrow's 24-hour broadcast schedule.

                AVAILABLE STUDIOS (Russian only + English only):
                RUSSIAN (7 studios):
                - momtv-news: MOM TV (News) — top RU streamers, breaking news. Anchors: Дмитрий Волков + Ирина Морозова
                - momtv-gaming: MOM TV Gaming — esports streams. Host: Максим Петров + Analyst: Артём Соколов
                - momtv-fps: MOM TV ФПС — FPS streams. Anchor: Олег Кузнецов + Commentator: Сергей Новиков
                - momtv-stream-kings: MOM TV Стрим Кингз — streamer profiles. Anchor: Татьяна Смирнова + Analyst: Анна Васильева
                - momtv-drama: MOM TV Драма — streamer drama. Host: Роман Волков + Co-host: Юлия Захарова
                - momtv-deep: MOM TV Глубокий Анализ — investigative. Narrator: Елена Морозова + Analyst: Николай Орлов
                - momtv-newcomers: MOM TV Новичок — rising streamers. Scout: Марина Лебедева + Critic: Павел Фёдоров

                ENGLISH (2 studios):
                - momtv-international: MOM TV International — global stream news. Anchor: Alex Morgan + Analyst: Sasha Taylor
                - momtv-gaming-en: MOM TV Gaming EN — EN esports. Host: Jordan Davis + Caster: Blake Anderson

                SCHEDULING RULES:
                1. 24 hourly slots (00:00 to 23:00 UTC)
                2. RU studios get ~75% of slots (18), EN studios get ~25% (6)
                3. Prime time hours (07, 08, 12, 18, 19, 20, 21) get top studios
                4. No character works more than 8 hours per day
                5. Rotate studios fairly — every studio gets at least 1 slot
                6. News studios get morning (07-08) and evening (19) prime
                7. Gaming studios get evening/night (20-01)
                8. Drama gets late evening (21-23) — viewers love drama before bed
                9. Deep analysis gets late night (02-03, 22-23) — think piece time
                10. Consider character fame — high-fame characters get prime slots

                Return JSON with 24 slots, each with: hour, studioId, studioName, language, cast array with characterId/characterName/role/isLead, isPrimetime.
                Also include strategyNotes explaining your decisions.

    # FIB intelligence — Natalia Bondarenko gathers intel
    agent-fib:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "FIB Agent — continuous intelligence gathering"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "*/5 * * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: character-natalia-bondarenko
            input: |
                INTELLIGENCE GATHERING — Natalia Bondarenko, field correspondent.
                Search the web for the latest gaming/streaming news.
                Look for: streamer drama, tournament results, platform changes, breaking stories.
                This intelligence is your currency — share valuable findings to build reputation.
                Return JSON with intelligence report.

infra:
    provider: microsoft.foundry