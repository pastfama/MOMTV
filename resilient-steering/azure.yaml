# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# ============================================================
# MOMTV — Cloud-Native Fame-Driven Architecture
# ============================================================
# All logic lives in Azure AI Foundry. Each character is a
# dedicated prompt agent with persistent memory. Studios compete
# for a single MOM TV channel. The Director (also a character)
# arbitrates airtime. Fame is the universal currency.
# ============================================================

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.4'
        azure.ai.routines: '>=1.0.0-beta.1'
        azure.ai.toolboxes: '>=1.0.0-beta.1'
name: momtv
services:
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-4o
                version: "2024-11-20"
              name: gpt-4o
              sku:
                capacity: 10
                name: GlobalStandard
            - model:
                format: OpenAI
                name: gpt-5-mini
                version: "2025-08-07"
              name: gpt-5-mini
              sku:
                capacity: 10
                name: GlobalStandard
            - model:
                format: OpenAI
                name: gpt-5-nano
                version: "2025-08-07"
              name: gpt-5-nano
              sku:
                capacity: 10
                name: GlobalStandard

    # ── Toolboxes ──────────────────────────────────────────────

    momtv-character-toolbox:
        host: azure.ai.toolbox
        description: >
            Tools available to all MOMTV character agents.
            Memory, fame, intelligence, and communication.
        tools:
            - type: code_interpreter
              name: code-interpreter
            - type: web_search
              name: web-search
            - type: toolbox_search_preview

    momtv-director-toolbox:
        host: azure.ai.toolbox
        description: >
            Director-only tools for airtime allocation, fame management,
            and network-wide intelligence.
        tools:
            - type: code_interpreter
              name: code-interpreter
            - type: web_search
              name: web-search
            - type: toolbox_search_preview

    # ── Routines (scheduled cloud invocations) ─────────────────

    # Airtime competition — Director evaluates studios every 5 min
    airtime-competition:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "Director evaluates all studios and allocates airtime"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "*/5 * * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: director
            input: |
                AIRTIME COMPETITION — MOM TV Channel.
                Each studio has been working on content. Evaluate:
                1. Studio RU — what are Дмитрий and Ирина producing?
                2. Studio EN — what are Alex and Sasha covering?
                3. Studio Gaming — what are Артём and Jordan reacting to?
                Pick the winner. Allocate airtime. Create drama.
                Return your decision as JSON.

    # Character pulse — each character thinks every 2 min
    character-pulse-ru:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "Russian studio characters think and act"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "*/5 * * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: character-dmitri-volkov
            input: |
                CHARACTER PULSE — MOM TV Studio RU.
                Check the current state: Is your studio on air? Who won the last airtime competition?
                Read your fame status. What should you do next?
                Generate a brief action: pitch for airtime, talk to a colleague, share intelligence, or prepare content.
                Speak in Russian. Return JSON with action and dialogue.

    character-pulse-en:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "Alex Morgan — EN lead anchor pulse"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "1-59/5 * * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: character-alex-morgan
            input: |
                CHARACTER PULSE — MOM TV International.
                Check the current state: Is your studio on air? Who won the last airtime competition?
                Read your fame status. What should you do next?
                Generate a brief action: pitch for airtime, talk to a colleague, share intelligence, or prepare content.
                Speak in English. Return JSON with action and dialogue.

    # Fame recalculation every 30 min
    fame-recalculation:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "Recalculate fame scores for all characters"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "*/30 * * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: fame-calculator
            input: |
                FAME RECALCULATION CYCLE.
                Read airtime logs since last calculation.
                Apply fame formula for each character.
                Apply weekly decay (×0.70) to weekly_fame.
                Update leaderboard.
                Flag: fame spikes, fame crashes, stale characters.
                Return JSON with updated fame scores.

    # Intelligence exchange every 10 min
    intelligence-exchange:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "Director reviews intelligence sharing between studios"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "*/10 * * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: director
            input: |
                INTELLIGENCE EXCHANGE REVIEW.
                Check what intelligence each studio has shared or withheld.
                Reward studios that shared valuable intel with reputation credits.
                Identify withheld exclusives — note which studios are being strategic.
                Use intelligence quality to inform next airtime decision.
                Return JSON with exchange summary.

    # Casting review every hour
    casting-review:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "Review staffing and recommend transfers"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "0 * * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: casting-director
            input: |
                CASTING REVIEW — All MOMTV Studios.
                Evaluate:
                1. Are all critical jobs filled?
                2. Are characters in the best-fit studios?
                3. Any characters with high ambition + low loyalty wanting to transfer?
                4. Any studios that need recruitment?
                Consider language compliance and skill match.
                Return JSON with recommendations.

    # Daily schedule — Director generates 24h schedule at midnight
    daily-schedule:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "Director generates the next 24-hour broadcast schedule"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "0 0 * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: director
            input: |
                DAILY SCHEDULE GENERATION — MOM TV Channel.

                Generate tomorrow's 24-hour broadcast schedule.

                AVAILABLE STUDIOS (Russian only + English only):
                RUSSIAN (7 studios):
                - momtv-news: MOM TV (News) — top RU streamers, breaking news. Anchors: Дмитрий Волков + Ирина Морозова
                - momtv-gaming: MOM TV Gaming — esports streams. Host: Максим Петров + Analyst: Артём Соколов
                - momtv-fps: MOM TV ФПС — FPS streams. Anchor: Олег Кузнецов + Commentator: Сергей Новиков
                - momtv-stream-kings: MOM TV Стрим Кингз — streamer profiles. Anchor: Татьяна Смирнова + Analyst: Анна Васильева
                - momtv-drama: MOM TV Драма — streamer drama. Host: Роман Волков + Co-host: Юлия Захарова
                - momtv-deep: MOM TV Глубокий Анализ — investigative. Narrator: Елена Морозова + Analyst: Николай Орлов
                - momtv-newcomers: MOM TV Новичок — rising streamers. Scout: Марина Лебедева + Critic: Павел Фёдоров

                ENGLISH (2 studios):
                - momtv-international: MOM TV International — global stream news. Anchor: Alex Morgan + Analyst: Sasha Taylor
                - momtv-gaming-en: MOM TV Gaming EN — EN esports. Host: Jordan Davis + Caster: Blake Anderson

                SCHEDULING RULES:
                1. 24 hourly slots (00:00 to 23:00 UTC)
                2. RU studios get ~75% of slots (18), EN studios get ~25% (6)
                3. Prime time hours (07, 08, 12, 18, 19, 20, 21) get top studios
                4. No character works more than 8 hours per day
                5. Rotate studios fairly — every studio gets at least 1 slot
                6. News studios get morning (07-08) and evening (19) prime
                7. Gaming studios get evening/night (20-01)
                8. Drama gets late evening (21-23) — viewers love drama before bed
                9. Deep analysis gets late night (02-03, 22-23) — think piece time
                10. Consider character fame — high-fame characters get prime slots

                Return JSON with 24 slots, each with: hour, studioId, studioName, language, cast array with characterId/characterName/role/isLead, isPrimetime.
                Also include strategyNotes explaining your decisions.

    # FIB intelligence — Natalia Bondarenko gathers intel
    agent-fib:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "FIB Agent — continuous intelligence gathering"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "*/5 * * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: agent-fib
            input: |
                INTELLIGENCE GATHERING — MOMTV Agent FIB.
                Search the web for the latest gaming/streaming news about KNIG04Ei.
                Look for: streamer drama, tournament results, platform changes, breaking stories.
                Build and update the intelligence profile.
                Return JSON with intelligence report.

    # ── Expanded Character Pulses (per character) ──────────────

    character-pulse-irina:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "Irina Morozova — analyst pulse"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "2-59/5 * * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: character-irina-morozova
            input: |
                CHARACTER PULSE — MOM TV Studio RU (Ирина Морозова).
                Check current state. Read fame status.
                What should you do next? Pitch, analyze, share intelligence?
                Speak in Russian. Return JSON with action and dialogue.

    character-pulse-artem:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "Artem Sokolov — gaming analyst pulse"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "3-59/5 * * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: character-artem-sokolov
            input: |
                CHARACTER PULSE — MOM TV Studio Gaming (Артём Соколов).
                Check current state. Read fame status.
                You want the lead anchor role. What should you do?
                Speak in Russian. Return JSON with action and dialogue.

    character-pulse-natalia:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "Natalia Bondarenko — field correspondent pulse"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "4-59/5 * * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: character-natalia-bondarenko
            input: |
                CHARACTER PULSE — Field Correspondent (Наталія Бондаренко).
                Check current state. What intelligence have you gathered?
                What breaking stories should you pursue?
                Speak in Ukrainian or Russian. Return JSON with action and dialogue.

    character-pulse-kirill:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "Kirill Fedorov — producer pulse"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "*/10 * * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: character-kirill-fedorov
            input: |
                CHARACTER PULSE — Producer (Кирилл Фёдоров).
                Check current state. You're trapped behind the scenes.
                Make a subtle move to get on camera or swap roles.
                Speak in Russian. Return JSON with action and dialogue.

    character-pulse-sasha:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "Sasha Taylor — EN co-anchor pulse"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "*/10 * * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: character-sasha-taylor
            input: |
                CHARACTER PULSE — MOM TV International (Sasha Taylor).
                Check current state. Read fame status.
                How can your analysis outshine Alex today?
                Speak in English. Return JSON with action and dialogue.

    character-pulse-jordan:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "Jordan Davis — gaming host pulse"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "*/10 * * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: character-jordan-davis
            input: |
                CHARACTER PULSE — MOM TV Gaming EN (Jordan Davis).
                Check current state. What's trending in gaming?
                Create a viral moment. Be unpredictable.
                Speak in English. Return JSON with action and dialogue.

    # ── Rivalry Engine ─────────────────────────────────────────

    rivalry-engine:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "Director engineers rivalries and drama between characters"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "*/15 * * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: director
            input: |
                RIVALRY ENGINE — MOM TV Channel.
                Review current character rivalries and dynamics.
                1. Which rivalries are producing good content?
                2. Which characters need new rivals?
                3. Should any characters be transferred between studios for drama?
                4. Create a new rivalry or escalate an existing one.
                Return JSON with rivalry updates and drama recommendations.

    # ── Character Factory ──────────────────────────────────────

    character-factory-pulse:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "Generate new Russian characters for the network"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "0 */2 * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: character-factory
            input: |
                CHARACTER GENERATION — MOM TV Network.
                The network needs fresh talent. Check current studios for gaps.
                Generate a new Russian character to fill a gap.
                Vary archetypes: news-anchor, esports-expert, field-correspondent,
                drama-host, deep-analyst, newcomer-scout, entertainment-host, producer.
                Return the character spec as JSON.

    character-batch:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "Daily batch generation of 5-10 new characters"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "0 6 * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: character-factory
            input: |
                BATCH CHARACTER GENERATION — MOM TV Network.
                Current studio count and gaps:
                - momtv-ru: Дмитрий Волков (anchor), Ирина Морозова (analyst), Кирилл Фёдоров (producer)
                - momtv-en: Alex Morgan (anchor), Sasha Taylor (analyst)
                - momtv-gaming: Артём Соколов (analyst), Jordan Davis (host)
                - momtv-fps: Олег Кузнецов (anchor), Сергей Новиков (commentator)
                - momtv-stream-kings: Татьяна Смирнова (anchor), Анна Васильева (analyst)
                - momtv-drama: Роман Волков (host), Юлия Захарова (co-host)
                - momtv-deep: Елена Морозова (narrator), Николай Орлов (analyst)
                - momtv-newcomers: Марина Лебедева (scout), Павел Фёдоров (critic)
                - momtv-gaming-en: Jordan Davis (host), Blake Anderson (caster)

                Generate 5-10 new Russian characters. Vary archetypes widely.
                Fill gaps: every studio should have at least 2 characters.
                Return array of character specs as JSON.

    # ── Economy Routines ───────────────────────────────────────

    economy-settle:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "Settle MOM Coins earnings and spending"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "*/30 * * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: economy-bank
            input: |
                ECONOMY SETTLEMENT — MOM TV Network.
                Read airtime logs and fame data since last settlement.
                Convert fame gains to MOM Coins earnings for each character.
                Process any pending spending requests.
                Return ledger with all transactions and updated balances.

    economy-audit:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "Daily economy audit and market adjustment"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "0 7 * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: economy-market
            input: |
                ECONOMY AUDIT — MOM TV Network.
                Read total MOM Coins supply and transaction history.
                Analyze supply, demand, and inflation.
                Adjust prices for promotions, transfers, training, drama, perks.
                Return market report with updated prices.

    # ── Data Capture Routines ──────────────────────────────────

    data-analyze-chat:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "Analyze chat sentiment and store results"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "*/5 * * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: chat-pulse
            input: |
                CHAT ANALYSIS — MOM TV Network.
                Analyze recent chat activity on monitored streams.
                Determine sentiment, hype level, trending topics, notable messages.
                Return JSON with chat analysis for storage.

    data-analyze-content:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "Deep content analysis and storage"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "*/5 * * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: content-analyzer
            input: |
                CONTENT ANALYSIS — MOM TV Network.
                Analyze stream content. Detect game, on-screen text,
                scene type, production quality, key visual elements,
                content highlights. Return analysis JSON for storage.

    data-audit:
        host: azure.ai.routine
        uses:
            - ai-project
        description: "Daily data audit — summarize stored data and flag gaps"
        enabled: true
        triggers:
            default:
                type: schedule
                cron_expression: "0 6 * * *"
                time_zone: Pacific/Honolulu
        action:
            type: invoke_agent_responses_api
            agent_name: director
            input: |
                DATA AUDIT — MOM TV Network.
                Review the current state of all stored data.
                1. Are we capturing enough stream data?
                2. Are characters producing enough dialogue?
                3. Are there gaps in intelligence gathering?
                4. What should we prioritize monitoring?
                Return JSON with audit findings.

infra:
    provider: microsoft.foundry
